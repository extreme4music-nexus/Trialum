<rect x="1090" y="308" width="29" height="17" fill="#c7e7d1" stroke="#427d60" stroke-dasharray="5 3"/>
<text x="1130" y="322" font-family="Arial" font-size="14" fill="#305b47">Леи · 4 × 5 позиции</text>
<circle cx="1103" cy="355" r="9" fill="#cce9f4" stroke="#3989aa" stroke-dasharray="4 4"/>
<text x="1130" y="360" font-family="Arial" font-size="14" fill="#305b47">Базени · резервиран простор</text>
<circle cx="1103" cy="394" r="4" fill="white" stroke="#2c7a9e" stroke-width="2"/>
<text x="1130" y="398" font-family="Arial" font-size="14" fill="#305b47">4 водни engine slots</text>
<text x="1090" y="450" font-family="Arial" font-size="14" font-weight="700" fill="#1b4838">ШТО Е СЕГА?</text>
<text x="1090" y="480" font-family="Arial" font-size="13" fill="#47685f">• Само floor / shell / roof</text>
<text x="1090" y="504" font-family="Arial" font-size="13" fill="#47685f">• Стаклени ѕидови / отвор</text>
<text x="1090" y="528" font-family="Arial" font-size="13" fill="#47685f">• Координати и зони</text>
<text x="1090" y="552" font-family="Arial" font-size="13" fill="#47685f">• Без растенија и предмети</text>
<text x="1090" y="576" font-family="Arial" font-size="13" fill="#47685f">• Без нова game логика</text>
<text x="1090" y="680" font-family="Arial" font-size="15" font-weight="700" fill="#1b4838">МЕРКИ (ПРЕДЛОГ)</text>
<text x="1090" y="711" font-family="Arial" font-size="13" fill="#47685f">Центар: Ø 34 m</text>
<text x="1090" y="734" font-family="Arial" font-size="13" fill="#47685f">Прсти: 26–51 m</text>
<text x="1090" y="757" font-family="Arial" font-size="13" fill="#47685f">Целина: ~82 × 96 m</text>
<text x="1090" y="780" font-family="Arial" font-size="13" fill="#47685f">Стаклен кров: до 12 m</text>
<text x="1090" y="803" font-family="Arial" font-size="13" fill="#47685f">Врата: 2.5 × 3.15 m</text>
<rect x="130" y="908" width="1140" height="72" rx="12" fill="#e2efe9" stroke="#b3cdc0"/>
<text x="155" y="936" font-family="Arial" font-size="15" font-weight="700" fill="#214f41">Сите испрекинати форми се резервации за идните делови, НЕ поставени 3D објекти.</text>
<text x="155" y="962" font-family="Arial" font-size="14" fill="#43685b">1 unit = 1 m · координати: X десно, Z+ кон лоби, Z− кон прстите · предложени димензии, сопственичка ревизија предстои</text>
