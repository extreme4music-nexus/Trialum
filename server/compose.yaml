# First-run localhost-only prototype. Never change bind host to 0.0.0.0.
name: trialum-social
services:
  trialum-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trialum
      POSTGRES_DB: trialum_social
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set a random secret in private .env}
      TRIALUM_HEALTH_PASSWORD: ${TRIALUM_HEALTH_PASSWORD:?Set a second random secret in private .env}
      TRIALUM_APP_PASSWORD: ${TRIALUM_APP_PASSWORD:-}
    volumes:
      - trialum_db_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_health_role.sh:/docker-entrypoint-initdb.d/002_health_role.sh:ro
      - ./sql/003_social_role.sh:/docker-entrypoint-initdb.d/003_social_role.sh:ro
      - ./sql/004_shared_playgrounds.sh:/docker-entrypoint-initdb.d/004_shared_playgrounds.sh:ro
      - ./sql/005_messages_push.sh:/docker-entrypoint-initdb.d/005_messages_push.sh:ro
      - ./sql/006_pet_presence.sh:/docker-entrypoint-initdb.d/006_pet_presence.sh:ro
    networks:
      - trialum_backend
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U trialum -d trialum_social"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
  trialum-api:
    build: .
    restart: unless-stopped
    depends_on:
      trialum-db:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://trialum_health:${TRIALUM_HEALTH_PASSWORD:?Set a second random secret in private .env}@trialum-db:5432/trialum_social
      SOCIAL_ENABLED: ${TRIALUM_SOCIAL_ENABLED:-false}
      SHARED_ENABLED: ${TRIALUM_SHARED_ENABLED:-false}
      PRESENCE_ENABLED: ${TRIALUM_PRESENCE_ENABLED:-false}
      PLAYGROUND_AI_ENABLED: ${TRIALUM_PLAYGROUND_AI_ENABLED:-false}
      MESSAGES_ENABLED: ${TRIALUM_MESSAGES_ENABLED:-false}
      PUSH_ENABLED: ${TRIALUM_PUSH_ENABLED:-false}
      TRIALUM_FREE_TEXT_ENABLED: ${TRIALUM_FREE_TEXT_ENABLED:-false}
      TRIALUM_DATA_KEY: ${TRIALUM_DATA_KEY:-}
      TRIALUM_FCM_PROJECT_ID: ${TRIALUM_FCM_PROJECT_ID:-}
      SOCIAL_DATABASE_URL: postgresql://trialum_app:${TRIALUM_APP_PASSWORD:-disabled}@trialum-db:5432/trialum_social
      SOCIAL_CORS_ORIGIN: https://appassets.androidplatform.net
    ports:
      - "127.0.0.1:${TRIALUM_HOST_PORT:-8787}:8787"
    networks:
      - trialum_backend
      - trialum_edge
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    mem_limit: 256m
    pids_limit: 128
volumes:
  trialum_db_data:
networks:
  trialum_backend:
    internal: true
  # API needs its own host-facing bridge for the loopback-published port.
  # Database is NOT on this network and has no published port.
  trialum_edge:
    driver: bridge
