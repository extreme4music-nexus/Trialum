name: TRIALUM 1.6-LW — controlled GitHub APK signing (NOT FOR PUBLIC RELEASE)

on:
  # Every trusted source change merged to main now triggers permanent owner-key
  # signing automatically. PRs NEVER receive secrets or publish APKs.
  # Signed binary commits live under artifacts/ and are deliberately NOT here,
  # avoiding a new workflow run on artifact-only commits.
  push:
    branches:
      - main
      - feature/trialum-1.6-lw-github-signing-setup-20261110
    paths:
      - 'android-template/**'
      - 'assets/**'
      - 'js/**'
      - 'locales/**'
      - 'vendor/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/android-signing.yml'
  pull_request:
    paths:
      - 'android-template/**'
      - 'assets/**'
      - 'js/**'
      - 'locales/**'
      - 'vendor/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/android-signing.yml'
  workflow_dispatch:

# Only the separate publish job receives content-write access. Signing and
# preflight retain read-only permissions and expose no credentials to PRs.
permissions:
  contents: read

concurrency:
  group: trialum-owner-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Full regression tests plus UNSIGNED Android candidate builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36 and build-tools 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install transient JS test modules
        run: npm install --no-save --ignore-scripts --no-audit jsdom@26.1.0 gifuct-js@2.1.2
      - name: Run game, world/backup, identity and social safety regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/engine.test.cjs
          node tests/evolution.test.cjs
          node tests/progression.test.cjs
          node tests/longplay.test.cjs
          TRIALUM_LOCALE_AUDIT=1 node tests/ui.test.cjs
          node tests/creature-media.test.cjs
          node tests/play-games.test.cjs
          node tests/version155.test.cjs
          node tests/forward-only.test.cjs
          node tests/social-ui.test.cjs
          node tests/messages-client.test.cjs
          node --test tests/release-f-gates.test.cjs
          node tests/shared-client.test.cjs
          node tests/playground.test.cjs
          node --test tests/lw-c-autonomy.test.cjs
          node --test tests/playground-ai.test.cjs
          node --test tests/dialogue-mix.test.cjs
          node --test tests/playground-memory.test.cjs
          node --test tests/presence.test.cjs
          node tests/lw-recovery-regression.test.cjs
          node --test tests/release-f.test.cjs
          node tests/signing-package-separation.test.cjs
          for file in js/*.js; do node --check "$file"; done
      # Native Friends reads R.string.trialum_social_api_url. The earlier debug
      # workflow forwarded this public HTTPS endpoint, but the permanent-signer
      # workflow lost it. Both installable variants MUST embed it; otherwise the
      # app incorrectly claims that an otherwise healthy server is unconfigured.
      - name: Build unsigned Release, Signing QA and isolated Friends Debug candidates
        shell: bash
        env:
          PGS_PROJECT_ID: ${{ vars.TRIALUM_PGS_PROJECT_ID }}
          PGS_ACH_FIRST_PET: ${{ vars.TRIALUM_PGS_ACH_FIRST_PET }}
          PGS_ACH_FIRST_PLANT: ${{ vars.TRIALUM_PGS_ACH_FIRST_PLANT }}
          PGS_ACH_LEARNED: ${{ vars.TRIALUM_PGS_ACH_LEARNED }}
          PGS_ACH_ADVANCED: ${{ vars.TRIALUM_PGS_ACH_ADVANCED }}
          PGS_ACH_ECOLOGY: ${{ vars.TRIALUM_PGS_ACH_ECOLOGY }}
          PGS_ACH_LAB6: ${{ vars.TRIALUM_PGS_ACH_LAB6 }}
          PGS_ACH_DNA: ${{ vars.TRIALUM_PGS_ACH_DNA }}
          PGS_BOARD_XP: ${{ vars.TRIALUM_PGS_BOARD_XP }}
          PGS_BOARD_SPECIES: ${{ vars.TRIALUM_PGS_BOARD_SPECIES }}
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
          TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
          TRIALUM_FIREBASE_API_KEY: ${{ vars.TRIALUM_FIREBASE_API_KEY }}
          TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
          TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
        run: |
          set -euo pipefail
          : "${TRIALUM_SOCIAL_API_URL:?GitHub Actions Variable TRIALUM_SOCIAL_API_URL is required for signed Friends APKs}"
          [[ "$TRIALUM_SOCIAL_API_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?/?$ ]] || {
            echo "::error::TRIALUM_SOCIAL_API_URL must be an HTTPS hostname (port 443 only)"
            exit 1
          }
          social_url="${TRIALUM_SOCIAL_API_URL%/}"
          : "${PGS_PROJECT_ID:?GitHub Actions Variable TRIALUM_PGS_PROJECT_ID is required for Play Games Services candidates}"
          [[ "$PGS_PROJECT_ID" =~ ^[0-9]{6,25}$ ]] || {
            echo "::error::TRIALUM_PGS_PROJECT_ID must be the numeric Play Games Services project ID"
            exit 1
          }
          # A successful package-signing job is NEVER proof of usable Firebase
          # if distinct app packages silently inherit the Release Firebase ID.
          # Let PRs exercise safe offline-only Android builds when console setup
          # is pending; block trusted/main signing until IDs are correct.
          if [ -n "$TRIALUM_FIREBASE_APP_ID" ] && {
               [ -z "$TRIALUM_FIREBASE_APP_ID_SIGNQA" ] ||
               [ -z "$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG" ]; }; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Firebase per-package registration pending: running PR unsigned Android preflight with opt-in FCM disabled."
              TRIALUM_FIREBASE_APP_ID=""
              TRIALUM_FIREBASE_SENDER_ID=""
              TRIALUM_FIREBASE_PROJECT_ID=""
              TRIALUM_FIREBASE_API_KEY=""
              TRIALUM_FIREBASE_APP_ID_SIGNQA=""
              TRIALUM_FIREBASE_APP_ID_SIGNDEBUG=""
            else
              echo "::error::Register Release, Signing QA and Friends Debug as three Android apps in one Firebase project; set TRIALUM_FIREBASE_APP_ID_SIGNQA and TRIALUM_FIREBASE_APP_ID_SIGNDEBUG. Refusing falsely FCM-ready signed APKs."
              exit 1
            fi
          fi
          args=("-PtrialumSocialApiUrl=$social_url" "-PtrialumPgsProjectId=$PGS_PROJECT_ID")
          [ -n "$PGS_ACH_FIRST_PET" ] && args+=("-PtrialumPgsAchievement_first_pet=$PGS_ACH_FIRST_PET")
          [ -n "$PGS_ACH_FIRST_PLANT" ] && args+=("-PtrialumPgsAchievement_first_plant=$PGS_ACH_FIRST_PLANT")
          [ -n "$PGS_ACH_LEARNED" ] && args+=("-PtrialumPgsAchievement_learned=$PGS_ACH_LEARNED")
          [ -n "$PGS_ACH_ADVANCED" ] && args+=("-PtrialumPgsAchievement_advanced=$PGS_ACH_ADVANCED")
          [ -n "$PGS_ACH_ECOLOGY" ] && args+=("-PtrialumPgsAchievement_ecology=$PGS_ACH_ECOLOGY")
          [ -n "$PGS_ACH_LAB6" ] && args+=("-PtrialumPgsAchievement_lab6=$PGS_ACH_LAB6")
          [ -n "$PGS_ACH_DNA" ] && args+=("-PtrialumPgsAchievement_dna=$PGS_ACH_DNA")
          [ -n "$PGS_BOARD_XP" ] && args+=("-PtrialumPgsLeaderboard_xp=$PGS_BOARD_XP")
          [ -n "$PGS_BOARD_SPECIES" ] && args+=("-PtrialumPgsLeaderboard_species=$PGS_BOARD_SPECIES")
          # Preserve the public Firebase client configuration from the historic
          # working debug workflow. No server credentials or FCM private keys
          # enter the Android build; empty values leave push disabled.
          [ -n "$TRIALUM_FIREBASE_APP_ID" ] && args+=("-PtrialumFirebaseAppId=$TRIALUM_FIREBASE_APP_ID")
          [ -n "$TRIALUM_FIREBASE_SENDER_ID" ] && args+=("-PtrialumFirebaseSenderId=$TRIALUM_FIREBASE_SENDER_ID")
          [ -n "$TRIALUM_FIREBASE_PROJECT_ID" ] && args+=("-PtrialumFirebaseProjectId=$TRIALUM_FIREBASE_PROJECT_ID")
          [ -n "$TRIALUM_FIREBASE_API_KEY" ] && args+=("-PtrialumFirebaseApiKey=$TRIALUM_FIREBASE_API_KEY")
          [ -n "$TRIALUM_FIREBASE_APP_ID_SIGNQA" ] && args+=("-PtrialumFirebaseAppIdSignqa=$TRIALUM_FIREBASE_APP_ID_SIGNQA")
          [ -n "$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG" ] && args+=("-PtrialumFirebaseAppIdSigndebug=$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG")
          if [ -z "$TRIALUM_FIREBASE_APP_ID" ]; then
            echo "::warning::FCM is disabled in this build; game and inbox still work without remote push."
          else
            echo "::notice::Distinct per-package Firebase Android App IDs validated by Gradle; real FCM delivery STILL needs a physical device check."
          fi
          gradle -p android-template :app:assembleRelease :app:assembleSignqa :app:assembleSigndebug :app:bundleRelease --no-daemon --stacktrace "${args[@]}"
      - name: Inspect APK identities, non-debuggable manifests and bundled world assets
        shell: bash
        env:
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
          TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
        run: |
          set -euo pipefail
          TOOL=/usr/local/lib/android/sdk/build-tools/35.0.0/aapt
          : "${TRIALUM_SOCIAL_API_URL:?Missing social URL for signed-APK config verification}"
          social_url="${TRIALUM_SOCIAL_API_URL%/}"
          mkdir -p unsigned-candidates
          for variant in release signqa signdebug; do
            apk=$(find "android-template/app/build/outputs/apk/$variant" -name '*.apk' -print -quit)
            test -s "$apk"
            badging=$("$TOOL" dump badging "$apk")
            printf '%s\n' "$badging" | grep -Fq "versionCode='35'"
            if [ "$variant" = release ]; then
              printf '%s\n' "$badging" | grep -Fq "package: name='com.trialum.ziivaiskra'"
              printf '%s\n' "$badging" | grep -Fq "versionName='1.6-LW-dev.12'"
            elif [ "$variant" = signqa ]; then
              printf '%s\n' "$badging" | grep -Fq "package: name='com.trialum.ziivaiskra.signqa'"
              printf '%s\n' "$badging" | grep -Fq "versionName='1.6-LW-dev.12-signqa'"
              printf '%s\n' "$badging" | grep -Fq "application-label:'Trialum Signing QA'"
              "$TOOL" dump xmltree "$apk" AndroidManifest.xml | grep -Fq 'trialum-signqa'
            elif [ "$variant" = signdebug ]; then
              printf '%s\n' "$badging" | grep -Fq "package: name='com.trialum.ziivaiskra.signdebug'"
              printf '%s\n' "$badging" | grep -Fq "versionName='1.6-LW-dev.12-signdebug'"
              printf '%s\n' "$badging" | grep -Fq "application-label:'Trialum Friends Debug'"
              "$TOOL" dump xmltree "$apk" AndroidManifest.xml | grep -Fq 'trialum-signdebug'
            else
              echo "::error::Unexpected Android variant"; exit 1
            fi
            if [ "$variant" = signdebug ]; then
              printf '%s\n' "$badging" | grep -Fq 'application-debuggable' || {
                echo "::error::Friends Debug candidate unexpectedly lost debug flag"; exit 1;
              }
            elif printf '%s\n' "$badging" | grep -Fq 'application-debuggable'; then
              echo "::error::Release and Signing QA must be non-debuggable"; exit 1
            fi
            unzip -Z1 "$apk" | grep -Fxq "assets/web/js/storage.js"
            unzip -Z1 "$apk" | grep -Fxq "assets/web/js/presence.js"
            unzip -Z1 "$apk" | grep -Fxq "assets/web/locales/en.json"
            # Verify the value actually made it into each compiled APK's
            # native Android string resource (not merely a Gradle argument).
            "$TOOL" dump --values resources "$apk" > "$RUNNER_TEMP/trialum-$variant-resources.txt"
            grep -Fq "$social_url" "$RUNNER_TEMP/trialum-$variant-resources.txt" || {
              echo "::error::Signed $variant APK lost embedded HTTPS Friends server endpoint"
              exit 1
            }
            echo "PASS: $variant embeds the configured HTTPS Friends endpoint"
            grep -Fq "$PGS_PROJECT_ID" "$RUNNER_TEMP/trialum-$variant-resources.txt" || {
              echo "::error::Signed $variant APK lost configured Play Games project ID"
              exit 1
            }
            echo "PASS: $variant embeds the configured Play Games project ID"
            for expected_pgs_id in "$PGS_ACH_FIRST_PET" "$PGS_ACH_FIRST_PLANT" "$PGS_ACH_LEARNED" "$PGS_ACH_ADVANCED" "$PGS_ACH_ECOLOGY" "$PGS_ACH_LAB6" "$PGS_ACH_DNA" "$PGS_BOARD_XP" "$PGS_BOARD_SPECIES"; do
              [ -z "$expected_pgs_id" ] || grep -Fq "$expected_pgs_id" "$RUNNER_TEMP/trialum-$variant-resources.txt" || {
                echo "::error::Signed $variant APK lost a configured Play Games achievement/leaderboard ID"
                exit 1
              }
            done
            expected_firebase=""
            if [ -n "$TRIALUM_FIREBASE_APP_ID" ] &&
               [ -n "$TRIALUM_FIREBASE_APP_ID_SIGNQA" ] &&
               [ -n "$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG" ]; then
              expected_firebase="$TRIALUM_FIREBASE_APP_ID"
              if [ "$variant" = signqa ]; then expected_firebase="$TRIALUM_FIREBASE_APP_ID_SIGNQA"; fi
              if [ "$variant" = signdebug ]; then expected_firebase="$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG"; fi
            fi
            if [ -n "$expected_firebase" ]; then
              grep -Fq "$expected_firebase" "$RUNNER_TEMP/trialum-$variant-resources.txt" || {
                echo "::error::Signed $variant APK lost its package-specific Firebase App ID"; exit 1;
              }
              echo "PASS: $variant package-specific Firebase Android App ID is present"
            fi
            cp "$apk" "unsigned-candidates/trialum-$variant-UNSIGNED.apk"
            echo "PASS: unsigned $variant candidate, package and bundle verified"
          done
          aab=$(find android-template/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -s "$aab"
          unzip -t "$aab" >/dev/null
          unzip -Z1 "$aab" | grep -Fxq 'base/manifest/AndroidManifest.xml'
          cp "$aab" unsigned-candidates/trialum-release-UNSIGNED.aab
          echo 'PASS: unsigned Release AAB bundle structure verified; upload-key signing remains local.'
      - name: Rehearse APK signing with a DISPOSABLE CI key (never an owner key)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d "$RUNNER_TEMP/trialum-apk-sign-smoke.XXXXXX")
          trap 'rm -rf "$tmp"' EXIT
          export TRIALUM_SMOKE_KEYPASS='temporary-test-pass-only-NOT-a-release-key'
          keytool -genkeypair -noprompt -alias trialum-smoke \
            -keyalg RSA -keysize 3072 -validity 1 -storetype PKCS12 \
            -keystore "$tmp/ci-smoke.p12" \
            -storepass "$TRIALUM_SMOKE_KEYPASS" \
            -keypass "$TRIALUM_SMOKE_KEYPASS" \
            -dname 'CN=Disposable GitHub CI Test Key, O=Trialum QA, C=MK'
          BIN=/usr/local/lib/android/sdk/build-tools/35.0.0
          "$BIN/zipalign" -f -p 4 unsigned-candidates/trialum-signqa-UNSIGNED.apk "$tmp/aligned.apk"
          "$BIN/zipalign" -c -p 4 "$tmp/aligned.apk"
          "$BIN/apksigner" sign --ks "$tmp/ci-smoke.p12" --ks-type PKCS12 \
            --ks-key-alias trialum-smoke --ks-pass env:TRIALUM_SMOKE_KEYPASS \
            --key-pass env:TRIALUM_SMOKE_KEYPASS \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "$tmp/ci-smoke-signed.apk" "$tmp/aligned.apk"
          "$BIN/apksigner" verify --verbose --print-certs "$tmp/ci-smoke-signed.apk" > "$tmp/smoke-verification.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$tmp/smoke-verification.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$tmp/smoke-verification.txt"
          "$BIN/aapt" dump badging "$tmp/ci-smoke-signed.apk" | grep -Fq "package: name='com.trialum.ziivaiskra.signqa'"
          "$BIN/zipalign" -c -p 4 "$tmp/ci-smoke-signed.apk"
          echo 'DISPOSABLE CI signing rehearsal PASS. Ephemeral signing key and signed APK destroyed by cleanup; NOT the permanent Trialum signing identity.'

      # Private PR artifact for owner-controlled, local signing and device QA.
      # It contains no keystore, password, certificate private key or credentials.
      - name: Upload unsigned LW-C APK and AAB candidates for local owner signing
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trialum-lw-c-unsigned-local-signing-candidates
          path: unsigned-candidates/*
          if-no-files-found: error
          retention-days: 3

      # Unsigned APKs are intermediate job inputs, not user installables.
      # Do not publish any intermediate APK on push or PR. Only the owner-run
      # main workflow may hand its exact-source unsigned candidates to 'sign'.
      - name: Store UNSIGNED candidates for same-run signing only
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'extreme4music-nexus'))
        uses: actions/upload-artifact@v4
        with:
          name: trialum-internal-unsigned-builds-DO-NOT-INSTALL
          path: unsigned-candidates/*.apk
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Owner-controlled permanent GitHub signing — no public release
    needs: preflight
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'extreme4music-nexus'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install verified Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: trialum-internal-unsigned-builds-DO-NOT-INSTALL
          path: unsigned-candidates
      - name: Sign both candidates using private GitHub Secrets, enforce public SHA256 pins
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.TRIALUM_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASS: ${{ secrets.TRIALUM_RELEASE_STORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.TRIALUM_RELEASE_KEY_PASS }}
          QA_KEYSTORE_B64: ${{ secrets.TRIALUM_QA_KEYSTORE_B64 }}
          QA_STORE_PASS: ${{ secrets.TRIALUM_QA_STORE_PASS }}
          QA_KEY_PASS: ${{ secrets.TRIALUM_QA_KEY_PASS }}
          RELEASE_CERT_SHA256: ${{ vars.TRIALUM_RELEASE_CERT_SHA256 }}
          QA_CERT_SHA256: ${{ vars.TRIALUM_QA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          for variable in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASS RELEASE_KEY_PASS QA_KEYSTORE_B64 QA_STORE_PASS QA_KEY_PASS RELEASE_CERT_SHA256 QA_CERT_SHA256; do
            [ -n "$(printenv "$variable")" ] || { echo "::error::Missing signing configuration: $variable"; exit 1; }
          done
          work=$(mktemp -d "$RUNNER_TEMP/trialum-sign-XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$work/release.p12"
          printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$work/qa.p12"
          chmod 600 "$work/"*.p12
          test -s "$work/release.p12"
          test -s "$work/qa.p12"
          mkdir -p signed-candidates
          BIN=/usr/local/lib/android/sdk/build-tools/35.0.0
          sign_one() {
            variant="$1"; apk="$2"; pkg="$3"; ver="$4"; keystore="$5"; alias="$6"; expected="$7"; store_env="$8"; key_env="$9"; expects_debug="${10}"
            aligned="$work/$variant-aligned.apk"
            final="signed-candidates/Trialum-1.6-LW-$variant-SIGNED-CANDIDATE.apk"
            "$BIN/zipalign" -f -p 4 "$apk" "$aligned"
            "$BIN/zipalign" -c -p 4 "$aligned"
            "$BIN/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
              --ks-key-alias "$alias" --ks-pass "env:$store_env" \
              --key-pass "env:$key_env" --v2-signing-enabled true \
              --v3-signing-enabled true --out "$final" "$aligned"
            "$BIN/apksigner" verify --verbose --print-certs "$final" > "$work/$variant-verified.txt"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$work/$variant-verified.txt"
            digest=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$work/$variant-verified.txt")
            wanted=$(printf '%s' "$expected" | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')
            [ "$(printf %s "$wanted" | wc -c)" -eq 64 ] && [ "$digest" = "$wanted" ] || { echo "::error::Public certificate SHA-256 mismatch: $variant"; exit 1; }
            badging=$("$BIN/aapt" dump badging "$final")
            printf '%s\n' "$badging" | grep -Fq "package: name='$pkg'"
            printf '%s\n' "$badging" | grep -Fq "versionCode='35'"
            printf '%s\n' "$badging" | grep -Fq "versionName='$ver'"
            if [ "$expects_debug" = true ]; then
              printf '%s\n' "$badging" | grep -Fq 'application-debuggable' || { echo "::error::Friends Debug APK must be debuggable"; exit 1; }
            elif [ "$expects_debug" = false ]; then
              if printf '%s\n' "$badging" | grep -Fq 'application-debuggable'; then echo "::error::Release/Signing QA must not be debuggable"; exit 1; fi
            else
              echo "::error::Unknown debug policy for $variant"; exit 1
            fi
            "$BIN/zipalign" -c -p 4 "$final"
            apkhash=$(sha256sum "$final" | cut -d ' ' -f 1)
            {
              printf 'source_sha=%s\n' "$GITHUB_SHA"
              printf 'package=%s\n' "$pkg"
              printf 'version=%s\n' "$ver"
              printf 'version_code=35\n'
              printf 'debuggable=%s\n' "$expects_debug"
              printf 'signing_certificate_sha256=%s\n' "$digest"
              printf 'apk_sha256=%s\n' "$apkhash"
              printf 'status=OWNER_SIGNED_INTERNAL_QA_NOT_PUBLIC_RELEASE\n'
            } > "signed-candidates/$variant-provenance.txt"
            echo "Verified signed $variant candidate: package=$pkg cert=$digest apk=$apkhash"
          }
          sign_one release unsigned-candidates/trialum-release-UNSIGNED.apk \
            com.trialum.ziivaiskra 1.6-LW-dev.12 "$work/release.p12" \
            trialum-release "$RELEASE_CERT_SHA256" RELEASE_STORE_PASS RELEASE_KEY_PASS false
          sign_one signqa unsigned-candidates/trialum-signqa-UNSIGNED.apk \
            com.trialum.ziivaiskra.signqa 1.6-LW-dev.12-signqa "$work/qa.p12" \
            trialum-qa "$QA_CERT_SHA256" QA_STORE_PASS QA_KEY_PASS false
          # This isolated debuggable FRIENDS client uses exactly the same
          # permanent QA signing identity as .signqa, NEVER the Release key.
          sign_one signdebug unsigned-candidates/trialum-signdebug-UNSIGNED.apk \
            com.trialum.ziivaiskra.signdebug 1.6-LW-dev.12-signdebug "$work/qa.p12" \
            trialum-qa "$QA_CERT_SHA256" QA_STORE_PASS QA_KEY_PASS true
          echo "::warning::DO NOT install normal signed main candidate over existing 1.5.6 Android Debug app: different certificate. Do not uninstall or clear data."
          echo "::notice::Use .signqa and .signdebug as two independent Friends accounts on the same phone; both use the permanent QA signer."
      # The only INSTALLABLE APK artifacts generated by this workflow are below,
      # after apksigner verification of the immutable owner-custodied
      # certificate pin for each Android package identity.
      - name: Save signed INTERNAL-ONLY candidates; never publish automatically
        uses: actions/upload-artifact@v4
        with:
          name: Trialum-1.6-LW-OWNER-SIGNED-INTERNAL-ONLY
          path: signed-candidates/*
          if-no-files-found: error
          retention-days: 7

  # Publish into the private Git tree *after* both cryptographic verification
  # and artifact upload complete. This job never receives private signing
  # keys or key passwords; it only receives the already-verified APKs.
  publish:
    name: Sync owner-signed Android apps into Git for desktop pull
    needs: sign
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'extreme4music-nexus'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: Trialum-1.6-LW-OWNER-SIGNED-INTERNAL-ONLY
          path: signed-candidates
      - name: Install Android signature verifier
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Independently verify signed APKs, provenance and owner certificate pins
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ vars.TRIALUM_RELEASE_CERT_SHA256 }}
          QA_CERT_SHA256: ${{ vars.TRIALUM_QA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BIN=/usr/local/lib/android/sdk/build-tools/35.0.0
          [ -n "$RELEASE_CERT_SHA256" ] && [ -n "$QA_CERT_SHA256" ] || {
            echo "::error::Public signer certificate pins missing"; exit 1;
          }
          mkdir -p artifacts/android/Release artifacts/android/Signing-QA artifacts/android/Friends-Debug
          verify_copy() {
            variant="$1"; pkg="$2"; destination="$3"; expected="$4"; isdebug="$5"
            apk="signed-candidates/Trialum-1.6-LW-$variant-SIGNED-CANDIDATE.apk"
            prov="signed-candidates/$variant-provenance.txt"
            test -s "$apk" && test -s "$prov" || { echo "::error::Missing verified $variant artifact"; exit 1; }
            sha=$(sha256sum "$apk" | awk '{print $1}')
            grep -Fxq "source_sha=$GITHUB_SHA" "$prov"
            grep -Fxq "package=$pkg" "$prov"
            grep -Fxq "version_code=35" "$prov"
            grep -Fxq "apk_sha256=$sha" "$prov"
            grep -Fxq "debuggable=$isdebug" "$prov"
            grep -Fxq "status=OWNER_SIGNED_INTERNAL_QA_NOT_PUBLIC_RELEASE" "$prov"
            "$BIN/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/$variant-cert.txt"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/$variant-cert.txt"
            cert=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$RUNNER_TEMP/$variant-cert.txt")
            wanted=$(printf '%s' "$expected" | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')
            [ "${#wanted}" -eq 64 ] && [ "$cert" = "$wanted" ] || { echo "::error::Unexpected $variant signing certificate"; exit 1; }
            grep -Fxq "signing_certificate_sha256=$cert" "$prov"
            badge=$("$BIN/aapt" dump badging "$apk")
            printf '%s\n' "$badge" | grep -Fq "package: name='$pkg'"
            printf '%s\n' "$badge" | grep -Fq "versionCode='35'"
            if [ "$isdebug" = true ]; then
              printf '%s\n' "$badge" | grep -Fq 'application-debuggable'
            else
              if printf '%s\n' "$badge" | grep -Fq 'application-debuggable'; then
                echo "::error::Unexpected debuggable release candidate"; exit 1
              fi
            fi
            cp "$apk" "$destination/Trialum-$variant.apk"
            cp "$prov" "$destination/provenance.txt"
            echo "PASS Git-sync package=$pkg cert=$cert apk_sha256=$sha"
          }
          verify_copy release com.trialum.ziivaiskra artifacts/android/Release "$RELEASE_CERT_SHA256" false
          verify_copy signqa com.trialum.ziivaiskra.signqa artifacts/android/Signing-QA "$QA_CERT_SHA256" false
          verify_copy signdebug com.trialum.ziivaiskra.signdebug artifacts/android/Friends-Debug "$QA_CERT_SHA256" true
      - name: Commit latest verified Android APKs to main for desktop Git sync
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite newer app source with a stale build.
          remote=$(git ls-remote origin refs/heads/main | cut -f 1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::warning::Main advanced since build; skip stale APK commit. Next trusted main code push will sign the newer source."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/android/Release artifacts/android/Signing-QA artifacts/android/Friends-Debug
          if git diff --cached --quiet; then
            echo 'Signed APK bytes unchanged; repository already synchronized.'
            exit 0
          fi
          git commit -m "build(android): sync pinned-owner-signed APKs from $GITHUB_SHA [skip ci]"
          git push origin HEAD:main
          echo 'PASS: All verified Android APKs persisted to main for Git clone/pull.'
