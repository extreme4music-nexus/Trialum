name: TRIALUM Social Server Security & Friends

on:
  push:
    branches:
      - main
      - feature/trialum-v1.5.6-social-playground-foundation
      - feature/trialum-v1.5.6-b-friends
      - feature/trialum-v1.5.6-d-shared-playground
    paths:
      - 'server/**'
      - 'js/social.js'
      - 'js/shared-playground.js'
      - 'tests/social-ui.test.cjs'
      - '.github/workflows/social-server-foundation.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/social-server-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Server contracts + syntax + Docker config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check server/src/index.mjs
          node --check server/src/contracts.mjs
          node --check server/src/social.mjs
          node --check server/src/shared.mjs
          node --check server/src/live.mjs
          node --check js/social.js
      - name: Install server runtime dependencies for WebSocket integration
        run: npm install --prefix server --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run contract regression tests
        run: |
          node --test server/tests/*.test.mjs
          node --test tests/social-ui.test.cjs
      - name: Validate private Docker topology
        env:
          PG_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRIALUM_HEALTH_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRIALUM_APP_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          docker compose -f server/compose.yaml config > /tmp/trialum-social-config.yml
          grep -Eq 'host_ip: 127[.]0[.]0[.]1' /tmp/trialum-social-config.yml
          ! grep -Eq 'host_ip: 0[.]0[.]0[.]0' /tmp/trialum-social-config.yml
          echo "Docker config validates; host API port is loopback-only."

      - name: Docker smoke test (isolated ephemeral CI data)
        env:
          PG_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRIALUM_HEALTH_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRIALUM_APP_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          docker compose -f server/compose.yaml up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8787/healthz | grep -q '"db":"connected"'
          curl --fail --silent --show-error http://127.0.0.1:8787/v1/meta | grep -q '"liveSocialEnabled":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/social/me)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/v1/invitations)" = "405"
          docker compose -f server/compose.yaml exec -T trialum-db psql -U trialum -d trialum_social -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public'" | grep -qx 16
          docker compose -f server/compose.yaml exec -T trialum-db psql -U trialum -d trialum_social -tAc "SELECT rolsuper FROM pg_roles WHERE rolname='trialum_health'" | grep -qx f
      - name: Enable social in isolated CI and test authenticated consent API
        env:
          PG_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRIALUM_HEALTH_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRIALUM_APP_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          TRIALUM_SOCIAL_ENABLED: "true"
        run: |
          docker compose -f server/compose.yaml up -d --no-deps --force-recreate trialum-api
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8787/v1/meta | grep -q '"liveSocialEnabled":true' && break
            sleep 1
          done
          node server/tests/social.integration.mjs
          docker compose -f server/compose.yaml exec -T trialum-api node --input-type=module -e '
            import pg from "pg";
            const c = new pg.Client({connectionString:process.env.SOCIAL_DATABASE_URL});
            await c.connect();
            try {
              await c.query("SELECT * FROM short_messages");
              process.exitCode=1;
            } catch(e) {
              if(e.code!=="42501") process.exitCode=1;
              else console.log("Social DB role cannot read private messages/push tables");
            }
            await c.end();
          '
      - name: Enable shared gameplay only in ephemeral CI and test 4-player authorization
        env:
          PG_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRIALUM_HEALTH_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRIALUM_APP_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccc
          TRIALUM_SOCIAL_ENABLED: "true"
          TRIALUM_SHARED_ENABLED: "true"
        run: |
          docker compose -f server/compose.yaml up -d --no-deps --force-recreate trialum-api
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/v1/meta | grep -q '"sharedPlaygroundEnabled":true' && break
            sleep 1
          done
          node server/tests/shared.integration.mjs
      - name: Tear down ephemeral CI services
        if: always()
        env:
          PG_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRIALUM_HEALTH_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRIALUM_APP_PASSWORD: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: docker compose -f server/compose.yaml down -v --remove-orphans
