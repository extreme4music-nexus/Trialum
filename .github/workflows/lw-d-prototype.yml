name: LW-D landscape prototype checks
on:
  push:
    paths:
      - 'prototypes/lw-d/**'
      - '.github/workflows/lw-d-prototype.yml'
  pull_request:
    paths:
      - 'prototypes/lw-d/**'
      - '.github/workflows/lw-d-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  lw-d-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate script syntax
        run: |
          node --check prototypes/lw-d/sim.js
          node --check prototypes/lw-d/world.js
          node --check prototypes/lw-d/lab-room.js
          node --check prototypes/lw-d/lab-process.js
          node --check prototypes/lw-d/lab-process.test.cjs
          node --check prototypes/lw-d/lab-room.test.cjs
          node --check prototypes/lw-d/sim.test.cjs
          node --check prototypes/lw-d/live-context.js
          node --check js/lw-d-interface.js
          node --check tests/lw-d-live-shell.test.cjs
          node --check prototypes/lw-d/world-navigation.js
          node --check tests/lw-d-world-navigation.test.cjs
          node --check tests/lw-d-hologram-immersive.test.cjs
      - name: Check educational simulation sandbox
        run: node --test prototypes/lw-d/sim.test.cjs
      - name: Guard real game bridge and offline cache compatibility
        run: node --test tests/lw-d-live-shell.test.cjs
      - name: Validate geometry, camera picking and full room contract
        run: node --test prototypes/lw-d/lab-room.test.cjs
      - name: Verify bounded process animation and no duplicate simulation
        run: node --test prototypes/lw-d/lab-process.test.cjs
      - name: Check hologram accessibility and native immersive isolation
        run: node --test tests/lw-d-hologram-immersive.test.cjs
      - name: Test hierarchical world menus and derived core resources
        run: node --test tests/lw-d-world-navigation.test.cjs
      - name: Build single-file offline 3D landscape preview
        run: |
          python3 prototypes/lw-d/build_preview.py
          test -s prototypes/lw-d/build/lw-d-landscape-preview.html
          grep -q 'ТРИАЛУМ' prototypes/lw-d/build/lw-d-landscape-preview.html
      - name: Upload the interactive one-file preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-LW-D0-Landscape-Interactive-Preview
          path: prototypes/lw-d/build/lw-d-landscape-preview.html
          if-no-files-found: error
          retention-days: 14
