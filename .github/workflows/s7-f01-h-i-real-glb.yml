name: Trialum S7 F01-H/I — 2 real cream marble finish GLBs (owner QA only)
on:
  push:
    branches:
      - feature/lw-d-s7-f01-h-i-cream-marble-finishes-20261118
    paths:
      - 'tools/b1/build-s7-f01-h-i-marble-finishes.py'
      - 'tests/lw-d-s7-f01-h-i-real-finishes.test.py'
      - '.github/workflows/s7-f01-h-i-real-glb.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trialum-s7-f01-h-i-cream-dual-review
  cancel-in-progress: false
jobs:
  build-original-marble-finishes:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout only isolated owner review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Build 1m matte H and fine-textured wet I GLBs; validate original F01-A frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/b1/build-s7-f01-h-i-marble-finishes.py > /tmp/f01-hi-manifest.json
          python3 tests/lw-d-s7-f01-h-i-real-finishes.test.py
          sha256sum build/s7-floor-f01/F01-HI/*.glb
      - name: Commit only physical two GLBs on isolated dev branch, never Classic or Play
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/lw-d-s7-f01-h-i-cream-marble-finishes-20261118"
          mkdir -p assets/models
          cp build/s7-floor-f01/F01-HI/*.glb assets/models/
          git config user.name "trialum-s7-glb-bot"
          git config user.email "trialum-s7-glb-bot@users.noreply.github.com"
          git add -f assets/models/f01-h-cream-marble-matte-service.glb
          git add -f assets/models/f01-i-cream-marble-fine-textured-wet.glb
          if git diff --cached --quiet; then
            echo "Existing real H/I binary models are up to date."
          else
            git commit -m "build(s7 F01-H/I): two actual honed and wet-finish cream marble GLBs"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          echo "No owner layout or gameplay code touched."
