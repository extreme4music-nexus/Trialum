name: TRIALUM v33 private server AI translator source bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-ai-patch-bundle.yml'
      - 'server/src/live.mjs'
      - 'server/src/shared.mjs'
      - 'server/src/pet-speech.mjs'
      - 'server/src/speech-translation.mjs'
      - 'server/translator/**'
      - 'server/compose.translation.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Verify exact v33 server modules and package no-secret private files
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version ancestry, no secrets and source syntax
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor db7c61927c161ed31fb8de93cbcb465ad1996c2e HEAD
          for file in live.mjs shared.mjs pet-speech.mjs speech-translation.mjs; do
            node --check "server/src/$file"
          done
          python3 - <<'PY'
          import ast
          for f in ['server/translator/service.py','server/translator/bootstrap_models.py']:
              ast.parse(open(f,encoding='utf-8').read(),filename=f)
          PY
      - name: Package private opt-in server modules only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/src bundle/translator
          cp server/src/{live,shared,pet-speech,speech-translation}.mjs bundle/src/
          cp server/translator/{service.py,bootstrap_models.py,Dockerfile} bundle/translator/
          cp server/compose.translation.yaml bundle/compose.translation.yaml
          cat > bundle/compose.lwd-translation.env.yaml <<'YAML'
          # Add as the LAST Compose override; do not replace an existing custom
          # port/Caddy/FCM configuration. OFF until translator passes private QA.
          services:
            trialum-api:
              environment:
                TRIALUM_TRANSLATION_ENABLED: ${TRIALUM_TRANSLATION_ENABLED:-false}
                TRIALUM_TRANSLATOR_URL: ${TRIALUM_TRANSLATOR_URL:-}
          YAML
          cat > bundle/README.txt <<'DOC'
          INTERNAL TRIALUM v33 TRANSLATION SOURCE PACKAGE — NOT AN AUTO INSTALLER
          1. Do not overwrite existing .env, compose.yaml, compose.push.yaml,
             DB, Caddy, ports, secrets, /models or private user data.
          2. Private root/operator backup of existing API source/Compose and
             a verified PostgreSQL dump + isolated restore are prerequisites.
          3. These are source modules and a separate optional translator image
             definition, NOT downloaded model files.
          4. Before enabling: install and license-review four pinned offline
             Helsinki-NLP OPUS translation weights; test real MK/SQ -> EN ->
             MK/SQ reference phrases and bench RAM/CPU on the private server.
          5. Use .env with TRIALUM_TRANSLATION_ENABLED=false until QA passes.
             Private worker endpoint is http://trialum-translator:5000/translate.
             Compose must include both compose.translation.yaml and
             compose.lwd-translation.env.yaml as final overrides.
          6. The existing production v32 AI service is already live; don't
             overwrite it without careful rollback and verified API health.
          7. No new public ports, no new SQL migration, no public Play release.
          DOC
          (cd bundle && sha256sum src/*.mjs translator/* compose.translation.yaml compose.lwd-translation.env.yaml > SHA256SUMS)
          printf 'source_sha=%s\nrequired_ancestor=%s\nversion=1.6-LW-dev.10-v33\nmode=INTERNAL_QA_ONLY\n' "$GITHUB_SHA" 'db7c61927c161ed31fb8de93cbcb465ad1996c2e' > bundle/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trialum-v33-private-translation-server-sources-INTERNAL
          path: bundle/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish verified ZIP in main/artifacts/server
    needs: bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: trialum-v33-private-translation-server-sources-INTERNAL
          path: bundle
      - name: Validate sources and create an independently downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd bundle && sha256sum -c SHA256SUMS)
          grep -Fxq "source_sha=${GITHUB_SHA}" bundle/PROVENANCE.txt
          grep -Fxq "mode=INTERNAL_QA_ONLY" bundle/PROVENANCE.txt
          test "$(find bundle -type f | wc -l)" -eq 12
          test ! -e bundle/.env
          test ! -e bundle/models
          mkdir -p artifacts/server
          (
            cd bundle
            zip -X -q -9 -r "../artifacts/server/Trialum-v33-private-server-sources.zip" .
          )
          unzip -tqq artifacts/server/Trialum-v33-private-server-sources.zip
          sha256sum artifacts/server/Trialum-v33-private-server-sources.zip \
            > artifacts/server/Trialum-v33-private-server-sources.zip.sha256
      - name: Safely commit ZIP and checksum to main (never force-push)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/server/Trialum-v33-private-server-sources.zip \
            artifacts/server/Trialum-v33-private-server-sources.zip.sha256
          if git diff --cached --quiet; then
            echo "Verified ZIP already matches main; no new commit needed."
            exit 0
          fi
          git commit -m "chore(artifacts): publish v33 server ZIP and SHA256 [skip ci]"
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
              server/src/live.mjs server/src/shared.mjs \
              server/src/pet-speech.mjs server/src/speech-translation.mjs \
              server/translator server/compose.translation.yaml \
              .github/workflows/server-ai-patch-bundle.yml; then
              echo "::error::Server source changed since this ZIP was built. A new run is required."
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "ZIP published to main/artifacts/server"
              exit 0
            fi
            echo "Concurrent main push, retrying without force (attempt $attempt)"
          done
          echo "::error::Main changed concurrently three times; ZIP was not published."
          exit 1
