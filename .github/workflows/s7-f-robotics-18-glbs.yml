name: S7-F feature only — 18 genuine robotics GLBs with rigid joint animation clips
on:
  push:
    branches:
      - feature/lw-d-s7-f-robotics-18-glbs-20261119
    paths:
      - 'assets/s7-f/s7-f-18-source.tar.gz.b64'
      - '.github/workflows/s7-f-robotics-18-glbs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trialum-game-s7-f-feature-18
  cancel-in-progress: false
jobs:
  build-18-feature-glbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source archive and restore generator, tests and handoff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,base64,gzip,hashlib,tarfile
          from pathlib import Path
          body=Path('assets/s7-f/s7-f-18-source.tar.gz.b64').read_text().strip()
          assert hashlib.sha256(body.encode()).hexdigest()=='19f9747b9b824a0ac12c6cdc1c55ed5f7be9c77efc00666aab7f8582de0dc5d3'
          names={'build_s7_f_robotics.py':'tools/b1/build_s7_f_robotics.py','verify_s7_f_robotics.py':'tests/verify_s7_f_robotics.py','S7_F_ROBOTICS_18_GLB_HANDOFF_20261119.md':'docs/S7_F_ROBOTICS_18_GLB_HANDOFF_20261119.md'}
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(base64.b64decode(body))),mode='r:') as z:
           ms=z.getmembers();assert set(m.name for m in ms)==set(names)
           for m in ms:
            assert m.isfile() and m.size<100000
            p=Path(names[m.name]);data=z.extractfile(m).read();p.parent.mkdir(parents=True,exist_ok=True)
            if p.exists():assert p.read_bytes()==data,'Unexpected source change '+str(p)
            else:p.write_bytes(data)
          PY
      - name: Build and validate genuine 18 GLB binaries and 8 review scenes
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'numpy==2.3.5' 'trimesh==4.11.1' 'networkx==3.6.1' 'scipy==1.17.0'
          python3 tools/b1/build_s7_f_robotics.py
          python3 tests/verify_s7_f_robotics.py
          test "$(find assets/models -maxdepth 1 -name 's7-f-*.glb' -type f | wc -l)" -eq 18
      - name: Commit only S7-F visual assets to isolated feature branch — NEVER game main
        run: |
          set -euo pipefail
          git config user.name 'trialum-s7-f-feature-robotics-bot'
          git config user.email 'trialum-s7-f@users.noreply.github.com'
          git add -f assets/models/s7-f-*.glb
          git add assets/s7-f/*.json tools/b1/build_s7_f_robotics.py tests/verify_s7_f_robotics.py docs/S7_F_ROBOTICS_18_GLB_HANDOFF_20261119.md
          git add projects/trialum-s7-f-*.json
          if git diff --staged --quiet; then echo 'All 18 genuine robotics GLBs already in feature'; exit 0; fi
          git commit -m 'feat(S7-F feature): 18 genuine robotics assets and joint clips, no live-game changes'
          git fetch origin feature/lw-d-s7-f-robotics-18-glbs-20261119
          git rebase origin/feature/lw-d-s7-f-robotics-18-glbs-20261119
          git push origin HEAD:feature/lw-d-s7-f-robotics-18-glbs-20261119