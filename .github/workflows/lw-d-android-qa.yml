name: LW-D L3.1 — existing SignQA Firebase + unsigned local-signing QA

on:
  push:
    branches:
      - feature/lw-d-landscape-live-shell-20261114
      - feature/lw-d-laboratory-room-20261114
      - feature/lw-d-l2-closeup-process-20261114
      - feature/lw-d-l2-2-hologram-immersive-20261114
      - feature/lw-d-l2-3-navigation-world-stats-20261114
      - feature/lw-d-l3-laboratory-complex-20261114
      - feature/lw-d-l3-1-detailed-laboratory-20261114
      - feature/lw-d-forward-consolidation-lwc-20261114
      - fix/lw-d-fcm-lwd1-20261114
    paths:
      - 'android-template/**'
      - 'prototypes/lw-d/**'
      - 'js/**'
      - 'assets/**'
      - 'locales/**'
      - 'tests/**'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/lw-d-android-qa.yml'
  pull_request:
    branches:
      - feature/lw-d-forward-consolidation-lwc-20261114
    paths:
      - 'android-template/**'
      - 'tests/**'
      - 'scripts/sign-lw-d-signqa-local.sh'
      - 'docs/LW_D_FCM_RESTORE_QA_PENDING_20261114.md'
      - '.github/workflows/lw-d-android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialum-lwd-signqa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lwd-signqa:
    name: Verify LW-D SignQA and prepare UNSIGNED APK for local signing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch commit without persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 36 and Build Tools 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Verify the additive scene UI and no accidental game state fork
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/lw-d-live-shell.test.cjs
          node --test tests/lw-d-hologram-immersive.test.cjs
          node --test tests/lw-d-world-navigation.test.cjs
          node --test prototypes/lw-d/lab-complex.test.cjs
          node --test prototypes/lw-d/lab-detail.test.cjs
          node --test tests/dialogue-session.test.cjs
          node --test tests/dialogue-mix.test.cjs
          node --test tests/playground-ai.test.cjs
          node --test tests/play-games.test.cjs
          node --test tests/lw-recovery-regression.test.cjs
          node --test tests/lw-d-legacy-recovery.test.cjs
          node --test tests/lw-d-fcm-build.test.cjs
          node --test prototypes/lw-d/sim.test.cjs
      - name: Compile-check Android Gradle configuration without Firebase or signing credentials
        shell: bash
        run: |
          set -euo pipefail
          # Evaluate Kotlin/AGP build types before checking real Firebase variables.
          # This does NOT produce an APK and does NOT claim FCM works.
          gradle -p android-template :app:help --no-daemon
      - name: Build LW-D using the existing SignQA Android identity and existing Firebase variables
        shell: bash
        env:
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
          TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
          TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
          TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
          TRIALUM_FIREBASE_API_KEY: ${{ vars.TRIALUM_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          # User-owned distribution split: Release and FriendsDebug = Codex;
          # SignQA = LW-D. No fourth Firebase registration or package ID.
          for required in TRIALUM_SOCIAL_API_URL TRIALUM_FIREBASE_APP_ID \
            TRIALUM_FIREBASE_APP_ID_SIGNQA TRIALUM_FIREBASE_APP_ID_SIGNDEBUG \
            TRIALUM_FIREBASE_SENDER_ID TRIALUM_FIREBASE_PROJECT_ID \
            TRIALUM_FIREBASE_API_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Existing Actions Variable $required is absent in this workflow context. Never generate a new Firebase app ID."
              exit 1
            fi
          done
          [[ "$TRIALUM_SOCIAL_API_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?/?$ ]] || {
            echo "::error::Social QA requires an HTTPS hostname on port 443"
            exit 1
          }
          social_url="${TRIALUM_SOCIAL_API_URL%/}"
          args=(
            "-PtrialumSocialApiUrl=$social_url"
            "-PtrialumFirebaseAppId=$TRIALUM_FIREBASE_APP_ID"
            "-PtrialumFirebaseAppIdSignqa=$TRIALUM_FIREBASE_APP_ID_SIGNQA"
            "-PtrialumFirebaseAppIdSigndebug=$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG"
            "-PtrialumFirebaseSenderId=$TRIALUM_FIREBASE_SENDER_ID"
            "-PtrialumFirebaseProjectId=$TRIALUM_FIREBASE_PROJECT_ID"
            "-PtrialumFirebaseApiKey=$TRIALUM_FIREBASE_API_KEY"
          )
          gradle -p android-template :app:assembleSignqa --no-daemon --stacktrace "${args[@]}"
      - name: Verify SignQA package, compiled Firebase/HTTPS resources and UNSIGNED status
        shell: bash
        env:
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
          TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
          TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
          TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          source_apk="$(find android-template/app/build/outputs/apk/signqa -type f -name '*.apk' | head -n 1)"
          test -s "$source_apk"
          tools_path="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$tools_path/aapt" dump badging "$source_apk" | grep -Fq "package: name='com.trialum.ziivaiskra.signqa'"
          "$tools_path/aapt" dump badging "$source_apk" | grep -Fq "versionCode='34'"
          "$tools_path/aapt" dump --values resources "$source_apk" > "$RUNNER_TEMP/lwd-signqa-compiled-resources.txt"
          for expected in "${TRIALUM_SOCIAL_API_URL%/}" "$TRIALUM_FIREBASE_APP_ID_SIGNQA" \
            "$TRIALUM_FIREBASE_PROJECT_ID" "$TRIALUM_FIREBASE_SENDER_ID"; do
            grep -Fq "$expected" "$RUNNER_TEMP/lwd-signqa-compiled-resources.txt" || {
              echo "::error::SignQA APK missing compiled Firebase/Social configuration"; exit 1;
            }
          done
          if [ "$TRIALUM_FIREBASE_APP_ID_SIGNQA" = "$TRIALUM_FIREBASE_APP_ID" ] ||
             [ "$TRIALUM_FIREBASE_APP_ID_SIGNQA" = "$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG" ]; then
            echo "::error::SignQA Firebase Android App ID must remain unique"; exit 1
          fi
          if "$tools_path/apksigner" verify "$source_apk" >/dev/null 2>&1; then
            echo "::error::SignQA candidate must remain UNSIGNED until local owner signing"; exit 1
          fi
          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/playground-dialogue-session.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/prototypes/lw-d/lab-detail.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          mkdir -p lw-d-signqa-candidate
          cp "$source_apk" lw-d-signqa-candidate/Trialum-LW-D-L3.1-SIGNQA-UNSIGNED.apk
          (cd lw-d-signqa-candidate && sha256sum Trialum-LW-D-L3.1-SIGNQA-UNSIGNED.apk > SHA256SUMS)
          {
            echo "source_commit=$GITHUB_SHA"
            echo "package_id=com.trialum.ziivaiskra.signqa"
            echo "version_code=34"
            echo "firebase_identity=EXISTING_SIGNQA_APP_ID_EMBEDDED_VERIFIED"
            echo "firebase_delivery=PHYSICAL_OWNER_TEST_PENDING"
            echo "signer=OWNER_QA_KEY_LOCAL_ONLY"
            echo "status=UNSIGNED_NOT_INSTALLABLE_UNTIL_LOCALLY_SIGNED"
            echo "codex_release_and_signdebug=NOT_TOUCHED"
            echo "data_scope=SIGNQA_ONLY_IF_LOCAL_SIGNER_MATCHES"
            echo "warning=DO_NOT_UNINSTALL_OR_CLEAR_ANY_TRIALUM_DATA"
          } > lw-d-signqa-candidate/BUILD-INFO.txt
      - name: Upload unsigned LW-D SignQA candidate for local owner signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-LW-D-L3-1-SIGNQA-UNSIGNED-${{ github.run_number }}
          path: lw-d-signqa-candidate/
          if-no-files-found: error
          retention-days: 14
