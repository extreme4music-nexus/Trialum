name: LW-D Agro S7 — TRUE empty-paw Greenhouse GLB + owner-signed SignQA

on:
  push:
    branches:
      - feature/lw-d-landscape-live-shell-20261114
      - feature/lw-d-laboratory-room-20261114
      - feature/lw-d-l2-closeup-process-20261114
      - feature/lw-d-l2-2-hologram-immersive-20261114
      - feature/lw-d-l2-3-navigation-world-stats-20261114
      - feature/lw-d-l3-laboratory-complex-20261114
      - feature/lw-d-l3-1-detailed-laboratory-20261114
      - feature/lw-d-forward-consolidation-lwc-20261114
      - fix/lw-d-fcm-lwd1-20261114
      - feature/lw-d-l3-2a-dna-foundation-20261114
      - feature/lw-d-l3-2b-functional-dna-20261114
      - feature/lw-d-l3-2c-mobile-visuals-20261114
      - feature/lw-d-l3-3a-food-laboratory-foundation-20261114
      - feature/lw-d-l3-3b-holographic-food-actions-20261114
      - feature/lw-d-l3-4a-flora-laboratory-foundation-20261114
      - feature/lw-d-l3-4b-functional-flora-20261114
      - fix/lw-d-dna-classic-parity-20261114
      - feature/lw-d-l3-5-research-complete-20261114
      - feature/lw-d-l3-6-lobby-entry-polish-20261114
      - feature/lw-d-l3-7-laboratory-life-reactions-20261115
      - feature/lw-d-l3-8-connected-hubs-menus-20261115
      - feature/lw-d-l3-9-ground-floor-agro-lobby-20261115
      - feature/lw-d-b1-threejs-glb-pilot-20261115
      - feature/lw-d-agro-lobby-s1-modular-20261115
      - feature/lw-d-agro-lobby-s2-world3d-menu-20261115
      - feature/lw-d-agro-s3-holographic-hud-parity-20261115
      - feature/lw-d-agro-s4-food-warehouse-room-20261115
      - feature/lw-d-agro-s5-warehouse-live-inventory-subrooms-20261115
      - feature/lw-d-agro-s6-food-supply-chain-pet-reserves-20261116
      - feature/lw-d-agro-s7-empty-greenhouse-shell-apk-20261116
      - feature/lw-d-agro-s7-g01-watercore-camera-20261116
      - feature/lw-d-agro-s7-g01-aquaglow-water-animation-20261116
    paths:
      - 'android-template/**'
      - 'prototypes/lw-d/**'
      - 'tools/b1/**'
      - 'js/**'
      - 'assets/**'
      - 'locales/**'
      - 'tests/**'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/lw-d-android-qa.yml'
  pull_request:
    branches:
      - feature/lw-d-forward-consolidation-lwc-20261114
    paths:
      - 'android-template/**'
      - 'tests/**'
      - 'docs/LW_D_FCM_RESTORE_QA_PENDING_20261114.md'
      - '.github/workflows/lw-d-android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialum-lwd-signqa-b1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lwd-signqa:
    name: Test LW-D and build verified UNSIGNED SignQA intermediate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch commit without persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 36 and Build Tools 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Build isolated actual offline Three.js GLB room and run B1 structural tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          # Deterministic S7 ORIGINAL three-part GLB shell, no online model source.
          python3 -m py_compile tools/b1/build-agro-greenhouse.py
          python3 tools/b1/build-agro-greenhouse.py
          # G-01 modular water core candidates: output only build/, NOT installed game.
          python3 -m py_compile tools/b1/build-agro-g01-watercore.py
          python3 tools/b1/build-agro-g01-watercore.py
          # Stage ONLY: authentic morph-animated water + canonical Aquaglow plant GLBs.
          python3 -m py_compile tools/b1/build-agro-g01-aquatic.py
          python3 tools/b1/build-agro-g01-aquatic.py
          # EXACT pinned versions; installed ONLY on GitHub CI build host, not user phone.
          npm install --prefix tools/b1 --no-audit --no-fund --package-lock=false
          node tools/b1/build-assets.mjs
          node --check tools/b1/generate-glb.mjs
          node --check prototypes/lw-d/b1/pilot-runtime.mjs
          node --check js/lw-d-b1-pilot-launcher.js
          node --test tests/lw-d-b1-glb-pilot.test.cjs
          # This was MISSING in #176: use the actual pinned GLTFLoader
          # to decode the generated GLB, instead of only reading raw JSON nodes.
          node --test tests/lw-d-b1-gltf-loader-runtime.test.cjs
          node --test tests/lw-d-b1-webgl-health.test.cjs
          # Independent actual Chromium WebGL2: 25 quality switches, 5 pointer taps,
          # 5 fallback/real GLB reloads; never a substitute for Galaxy A55 OWNER QA.
          node --check tests/lw-d-b1-browser-stress.mjs
          node tests/lw-d-b1-browser-stress.mjs
          # Agro S1: BUILD-ONLY original scene recipe -> real offline PBR GLB,
          # keeping reusable renderer fully separate from the authored scene.
          node --check tools/b1/build-agro-lobby.mjs
          node --check tools/b1/build-agro-bundle.mjs
          node --check prototypes/lw-d/three-core/scene-runtime.mjs
          node --check prototypes/lw-d/three-core/scene-app.mjs
          node --check js/lw-d-agro-lobby-launcher.js
          node --check tools/b1/build-food-warehouse.mjs
          node --check prototypes/lw-d/scenes/agro-food-warehouse/warehouse-app.mjs
          node --check prototypes/lw-d/scenes/agro-food-warehouse/warehouse-runtime.mjs
          node --check prototypes/lw-d/scenes/agro-food-warehouse/warehouse-canvas-fallback.mjs
          node --check prototypes/lw-d/scenes/agro-food-warehouse/warehouse-motion.mjs
          node --test tests/lw-d-warehouse-motion.test.mjs
          node --test tests/lw-d-warehouse-real-data.test.cjs
          node --test tests/lw-d-food-supply-chain.test.cjs
          node --check prototypes/lw-d/scenes/agro-food-warehouse/warehouse-rooms.mjs
          node --check prototypes/lw-d/scenes/agro-food-warehouse/warehouse-interactions.mjs
          node --check js/warehouse-inventory.js
          node --check js/food-supply-chain.js
          node --check js/food-home-ui.js
          node --check js/app.js
          node --check js/lw-d-interface.js
          node --check prototypes/lw-d/live-context.js
          node tools/b1/build-agro-bundle.mjs
          node --check prototypes/lw-d/scenes/agro-greenhouse/greenhouse-app.mjs
          node --check prototypes/lw-d/three-core/scene-runtime.mjs
          node --test tests/lw-d-s7-greenhouse-shell.test.cjs
          node --test tests/lw-d-s7-g01-watercore-candidates.test.cjs
          node --test tests/lw-d-s7-g01-aquatic-animation.test.cjs
          node --test tests/lw-d-s7-g01-aquatic-projection.test.mjs
          node --test tests/lw-d-agro-food-warehouse-assets.test.cjs
          node --test tests/lw-d-agro-lobby-scene.test.cjs
          node --check tests/lw-d-agro-lobby-browser-stress.mjs
          node tests/lw-d-agro-lobby-browser-stress.mjs
          # S2 real menu integration: no Classic mast shortcuts; same LW-D
          # menu routes, nested original GLB, audio/RAF exclusive, 3D return.
          node --check prototypes/lw-d/agro-scene-bridge.js
          node --check prototypes/lw-d/world-navigation.js
          node --check prototypes/lw-d/world-hub-pages.js
          node --test tests/lw-d-agro-world3d-integration.test.cjs
          node --check tests/lw-d-agro-world3d-menu-browser.mjs
          node tests/lw-d-agro-world3d-menu-browser.mjs
          test -s prototypes/lw-d/scenes/agro-food-warehouse/warehouse.bundle.js
          for filename in warehouse-shell smart-storage-rack cold-locker cargo-crates conveyor-sorter holo-inventory-kiosk mini-transporter; do
            test -s "prototypes/lw-d/scenes/agro-food-warehouse/$filename.glb"
          done
          test -s prototypes/lw-d/scenes/agro-lobby/atrium.glb
          test -s prototypes/lw-d/three-core/scene.bundle.js
          test -s prototypes/lw-d/b1/pilot-room.glb
          test -s prototypes/lw-d/b1/renderer.bundle.js
          test -s prototypes/lw-d/b1/vendor/THREE-MIT-LICENSE.txt
      - name: Upload genuine animated G01 water and 6 Aquaglow stage/health GLBs (REVIEW ONLY)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-S7-G01-ANIMATED-WATER-AQUAGLOW-GLB-REVIEW-${{ github.run_number }}
          path: build/g01-aquatic-review/
          if-no-files-found: error
          retention-days: 14
      - name: Upload five separate original G01 water-core GLB candidate assets (DESIGN REVIEW ONLY)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-S7-G01-WATER-CORE-GLB-REVIEW-${{ github.run_number }}
          path: build/g01-watercore/
          if-no-files-found: error
          retention-days: 14
      - name: Upload ACTUAL S7 empty shell three original GLBs and evidence (NOT OWNER PHONE PASS)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-S7-REAL-Empty-Paw-Glass-Shell-GLB-${{ github.run_number }}
          path: |
            prototypes/lw-d/scenes/agro-greenhouse/*.glb
            prototypes/lw-d/scenes/agro-greenhouse/scene.json
            prototypes/lw-d/scenes/agro-greenhouse/visual-recipe.json
            prototypes/lw-d/scenes/agro-greenhouse/asset-evidence.json
            prototypes/lw-d/scenes/agro-greenhouse/greenhouse.bundle.js
          if-no-files-found: error
          retention-days: 14
      - name: Upload original Agro S1 Chromium visual evidence (NOT OWNER PHONE PASS)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-Agro-S1-Visual-Evidence-${{ github.run_number }}
          path: tests/agro-lobby-visual-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify the additive scene UI and no accidental game state fork
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/lw-d-live-shell.test.cjs
          node --test tests/lw-d-hologram-immersive.test.cjs
          node --test tests/lw-d-world-navigation.test.cjs
          node --test prototypes/lw-d/lab-complex.test.cjs
          node --test tests/lw-d-lobby-entry.test.cjs
          node --test tests/lw-d-audio-spatial.test.cjs
          node --test tests/lw-d-l3-7-engine-visual.test.cjs
          node --test tests/lw-d-l3-8-connected-menu.test.cjs
          node --test tests/lw-d-l3-9-original-plant-engine.test.cjs
          node --test prototypes/lw-d/lab-detail.test.cjs
          node --test prototypes/lw-d/dna-room.test.cjs
          node --test prototypes/lw-d/food-room.test.cjs
          node --test prototypes/lw-d/flora-room.test.cjs
          node --test prototypes/lw-d/research-room.test.cjs
          node --test tests/lw-d-research-parity.test.cjs
          node --test tests/lw-d-flora-actions.test.cjs
          node --test tests/lw-d-food-actions.test.cjs
          node tests/progression.test.cjs
          node --test tests/lw-d-dna-actions.test.cjs
          node --test tests/lw-d-dna-parity.test.cjs
          node tests/longplay.test.cjs
          node --test tests/dialogue-session.test.cjs
          node --test tests/dialogue-mix.test.cjs
          node --test tests/playground-ai.test.cjs
          node --test tests/play-games.test.cjs
          node --test tests/lw-recovery-regression.test.cjs
          node --test tests/lw-d-legacy-recovery.test.cjs
          node --test tests/lw-d-fcm-build.test.cjs
          node --test prototypes/lw-d/sim.test.cjs
      - name: Syntax-check 3D DNA controller, parent bridge and game logic
        run: |
          node --check js/plant-lifecycle.js
          node --check js/plant-lifecycle-ui.js
          node --check js/app.js
          node --check js/lw-d-interface.js
          node --check prototypes/lw-d/live-context.js
          node --check prototypes/lw-d/dna-room.js
          node --check prototypes/lw-d/food-room.js
          node --check prototypes/lw-d/research-room.js
          node --check prototypes/lw-d/flora-room.js
          node --check prototypes/lw-d/world.js
          node --check prototypes/lw-d/event-reactions.js
          node --check prototypes/lw-d/spatial-audio.js
          node --check prototypes/lw-d/world-hub-pages.js
      - name: Compile-check Android Gradle configuration without Firebase or signing credentials
        shell: bash
        run: |
          set -euo pipefail
          # Evaluate Kotlin/AGP build types before checking real Firebase variables.
          # This does NOT produce an APK and does NOT claim FCM works.
          gradle -p android-template :app:help --no-daemon
      - name: Build LW-D using the existing SignQA Android identity and existing Firebase variables
        shell: bash
        env:
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
          TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
          TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
          TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
          TRIALUM_FIREBASE_API_KEY: ${{ vars.TRIALUM_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          # User-owned distribution split: Release and FriendsDebug = Codex;
          # SignQA = LW-D. No fourth Firebase registration or package ID.
          for required in TRIALUM_SOCIAL_API_URL TRIALUM_FIREBASE_APP_ID \
            TRIALUM_FIREBASE_APP_ID_SIGNQA TRIALUM_FIREBASE_APP_ID_SIGNDEBUG \
            TRIALUM_FIREBASE_SENDER_ID TRIALUM_FIREBASE_PROJECT_ID \
            TRIALUM_FIREBASE_API_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Existing Actions Variable $required is absent in this workflow context. Never generate a new Firebase app ID."
              exit 1
            fi
          done
          [[ "$TRIALUM_SOCIAL_API_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?/?$ ]] || {
            echo "::error::Social QA requires an HTTPS hostname on port 443"
            exit 1
          }
          social_url="${TRIALUM_SOCIAL_API_URL%/}"
          args=(
            "-PtrialumSocialApiUrl=$social_url"
            "-PtrialumFirebaseAppId=$TRIALUM_FIREBASE_APP_ID"
            "-PtrialumFirebaseAppIdSignqa=$TRIALUM_FIREBASE_APP_ID_SIGNQA"
            "-PtrialumFirebaseAppIdSigndebug=$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG"
            "-PtrialumFirebaseSenderId=$TRIALUM_FIREBASE_SENDER_ID"
            "-PtrialumFirebaseProjectId=$TRIALUM_FIREBASE_PROJECT_ID"
            "-PtrialumFirebaseApiKey=$TRIALUM_FIREBASE_API_KEY"
          )
          gradle -p android-template :app:assembleSignqa --no-daemon --stacktrace "${args[@]}"
      - name: Verify SignQA package, compiled Firebase/HTTPS resources and UNSIGNED status
        shell: bash
        env:
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
          TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
          TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
          TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          source_apk="$(find android-template/app/build/outputs/apk/signqa -type f -name '*.apk' | head -n 1)"
          test -s "$source_apk"
          tools_path="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$tools_path/aapt" dump badging "$source_apk" | grep -Fq "package: name='com.trialum.ziivaiskra.signqa'"
          "$tools_path/aapt" dump badging "$source_apk" | grep -Fq "versionCode='34'"
          "$tools_path/aapt" dump --values resources "$source_apk" > "$RUNNER_TEMP/lwd-signqa-compiled-resources.txt"
          for expected in "${TRIALUM_SOCIAL_API_URL%/}" "$TRIALUM_FIREBASE_APP_ID_SIGNQA" \
            "$TRIALUM_FIREBASE_PROJECT_ID" "$TRIALUM_FIREBASE_SENDER_ID"; do
            grep -Fq "$expected" "$RUNNER_TEMP/lwd-signqa-compiled-resources.txt" || {
              echo "::error::SignQA APK missing compiled Firebase/Social configuration"; exit 1;
            }
          done
          if [ "$TRIALUM_FIREBASE_APP_ID_SIGNQA" = "$TRIALUM_FIREBASE_APP_ID" ] ||
             [ "$TRIALUM_FIREBASE_APP_ID_SIGNQA" = "$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG" ]; then
            echo "::error::SignQA Firebase Android App ID must remain unique"; exit 1
          fi
          if "$tools_path/apksigner" verify "$source_apk" >/dev/null 2>&1; then
            echo "::error::SignQA candidate must remain UNSIGNED until local owner signing"; exit 1
          fi
          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/playground-dialogue-session.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/warehouse-inventory.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/food-supply-chain.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/food-home-ui.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          for asset in \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/scene.json \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/visual-recipe.json \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/greenhouse.html \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/greenhouse.css \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/greenhouse.bundle.js \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/greenhouse-shell.glb \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/greenhouse-floor-shell.glb \
            assets/web/prototypes/lw-d/scenes/agro-greenhouse/greenhouse-glass-roof-shell.glb; do
            grep -Fxq "$asset" "$RUNNER_TEMP/lwd-signqa-apk-files.txt" || {
              echo "::error::S7 mandatory real offline garden GLB asset absent: $asset"; exit 1;
            }
          done
          grep -Fxq "assets/web/prototypes/lw-d/lab-detail.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/prototypes/lw-d/spatial-audio.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/prototypes/lw-d/event-reactions.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/prototypes/lw-d/world-hub-pages.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/plant-lifecycle.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          grep -Fxq "assets/web/js/plant-lifecycle-ui.js" "$RUNNER_TEMP/lwd-signqa-apk-files.txt"
          for asset in \
            assets/web/js/lw-d-b1-pilot-launcher.js \
            assets/web/prototypes/lw-d/b1/pilot.html \
            assets/web/prototypes/lw-d/b1/pilot.css \
            assets/web/prototypes/lw-d/b1/pilot-scene.json \
            assets/web/prototypes/lw-d/b1/pilot-room.glb \
            assets/web/prototypes/lw-d/b1/renderer.bundle.js \
            assets/web/prototypes/lw-d/b1/vendor/THREE-MIT-LICENSE.txt; do
            grep -Fxq "$asset" "$RUNNER_TEMP/lwd-signqa-apk-files.txt" || {
              echo "::error::B1 mandatory offline GLB/Three.js asset not bundled: $asset"; exit 1;
            }
          done

          for asset in \
            assets/web/prototypes/lw-d/agro-scene-bridge.js \
            assets/web/prototypes/lw-d/scene-registry.json \
            assets/web/prototypes/lw-d/three-core/scene.bundle.js \
            assets/web/prototypes/lw-d/scenes/agro-lobby/scene.json \
            assets/web/prototypes/lw-d/scenes/agro-lobby/visual-recipe.json \
            assets/web/prototypes/lw-d/scenes/agro-lobby/lobby.html \
            assets/web/prototypes/lw-d/scenes/agro-lobby/lobby.css \
            assets/web/prototypes/lw-d/scenes/agro-lobby/atrium.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/warehouse.html \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/warehouse.css \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/scene.json \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/visual-recipe.json \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/fallback-manifest.json \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/warehouse.bundle.js \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/warehouse-shell.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/smart-storage-rack.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/cold-locker.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/cargo-crates.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/conveyor-sorter.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/holo-inventory-kiosk.glb \
            assets/web/prototypes/lw-d/scenes/agro-food-warehouse/mini-transporter.glb; do
            grep -Fxq "$asset" "$RUNNER_TEMP/lwd-signqa-apk-files.txt" || {
              echo "::error::Agro S1 required offline scene missing from APK: $asset"; exit 1;
            }
          done
          mkdir -p lw-d-signqa-candidate
          cp "$source_apk" lw-d-signqa-candidate/Trialum-LW-D-AGRO-S7-SIGNQA-UNSIGNED.apk
          (cd lw-d-signqa-candidate && sha256sum Trialum-LW-D-AGRO-S7-SIGNQA-UNSIGNED.apk > SHA256SUMS)
          {
            echo "source_commit=$GITHUB_SHA"
            echo "package_id=com.trialum.ziivaiskra.signqa"
            echo "version_code=34"
            echo "firebase_identity=EXISTING_SIGNQA_APP_ID_EMBEDDED_VERIFIED"
            echo "firebase_delivery=PHYSICAL_OWNER_TEST_PENDING"
            echo "signer=GITHUB_QA_SECRET_IN_TRUSTED_SIGN_JOB"
            echo "status=INTERNAL_UNSIGNED_INPUT_NOT_INSTALLABLE"
            echo "codex_release_and_signdebug=NOT_TOUCHED"
            echo "data_scope=SIGNQA_ONLY_IF_LOCAL_SIGNER_MATCHES"
            echo "warning=DO_NOT_UNINSTALL_OR_CLEAR_ANY_TRIALUM_DATA"
          } > lw-d-signqa-candidate/BUILD-INFO.txt
      - name: Upload intermediate SignQA APK for same-run protected signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-LW-D-AGRO-S7-SIGNQA-UNSIGNED-${{ github.run_number }}
          path: lw-d-signqa-candidate/
          if-no-files-found: error
          retention-days: 14

  sign-lw-d-signqa:
    name: Automatically sign ONLY LW-D Signing QA with existing permanent QA GitHub Secrets
    needs: build-lwd-signqa
    # PR runs (including forks) NEVER get signing secrets. Only owner-initiated
    # trusted branch pushes receive the already-configured QA key.
    # This separate lane NEVER signs Release or Friends Debug.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/lw-d-fcm-lwd1-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-2a-dna-foundation-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-2b-functional-dna-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-2c-mobile-visuals-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-3a-food-laboratory-foundation-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-3b-holographic-food-actions-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-4a-flora-laboratory-foundation-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-4b-functional-flora-20261114' || github.ref == 'refs/heads/fix/lw-d-dna-classic-parity-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-5-research-complete-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-6-lobby-entry-polish-20261114' || github.ref == 'refs/heads/feature/lw-d-l3-7-laboratory-life-reactions-20261115' || github.ref == 'refs/heads/feature/lw-d-l3-8-connected-hubs-menus-20261115' || github.ref == 'refs/heads/feature/lw-d-l3-9-ground-floor-agro-lobby-20261115' || github.ref == 'refs/heads/feature/lw-d-b1-threejs-glb-pilot-20261115' || github.ref == 'refs/heads/feature/lw-d-agro-lobby-s1-modular-20261115' || github.ref == 'refs/heads/feature/lw-d-agro-lobby-s2-world3d-menu-20261115' || github.ref == 'refs/heads/feature/lw-d-agro-s3-holographic-hud-parity-20261115' || github.ref == 'refs/heads/feature/lw-d-agro-s4-food-warehouse-room-20261115' || github.ref == 'refs/heads/feature/lw-d-agro-s5-warehouse-live-inventory-subrooms-20261115' || github.ref == 'refs/heads/feature/lw-d-agro-s6-food-supply-chain-pet-reserves-20261116' || github.ref == 'refs/heads/feature/lw-d-agro-s7-empty-greenhouse-shell-apk-20261116' || github.ref == 'refs/heads/feature/lw-d-agro-s7-g01-watercore-camera-20261116' || github.ref == 'refs/heads/feature/lw-d-agro-s7-g01-aquaglow-water-animation-20261116') && github.actor == 'extreme4music-nexus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install Android Build Tools used by existing owner signing workflow
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'build-tools;35.0.0'
      - name: Download exact-source verified UNSIGNED SignQA candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Trialum-LW-D-AGRO-S7-SIGNQA-UNSIGNED-${{ github.run_number }}
          path: unsigned-input
      - name: Sign with existing permanent QA key and verify pinned QA certificate
        shell: bash
        env:
          QA_KEYSTORE_B64: ${{ secrets.TRIALUM_QA_KEYSTORE_B64 }}
          QA_STORE_PASS: ${{ secrets.TRIALUM_QA_STORE_PASS }}
          QA_KEY_PASS: ${{ secrets.TRIALUM_QA_KEY_PASS }}
          QA_CERT_SHA256: ${{ vars.TRIALUM_QA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          for name in QA_KEYSTORE_B64 QA_STORE_PASS QA_KEY_PASS QA_CERT_SHA256; do
            [ -n "${!name:-}" ] || { echo "::error::Missing existing GitHub QA signing configuration $name"; exit 1; }
          done
          input=unsigned-input/Trialum-LW-D-AGRO-S7-SIGNQA-UNSIGNED.apk
          test -s "$input"
          (cd unsigned-input && sha256sum -c SHA256SUMS)
          BIN="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BIN/aapt" dump badging "$input" | grep -Fq "package: name='com.trialum.ziivaiskra.signqa'"
          work="$(mktemp -d "$RUNNER_TEMP/lwd-signqa.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$QA_KEYSTORE_B64" | base64 --decode > "$work/qa.p12"
          chmod 600 "$work/qa.p12"
          test -s "$work/qa.p12"
          "$BIN/zipalign" -f -p 4 "$input" "$work/aligned.apk"
          "$BIN/zipalign" -c -p 4 "$work/aligned.apk"
          mkdir -p signed-lw-d
          output=signed-lw-d/Trialum-LW-D-AGRO-S7-SIGNQA-SIGNED.apk
          "$BIN/apksigner" sign --ks "$work/qa.p12" --ks-type PKCS12 \
            --ks-key-alias trialum-qa --ks-pass env:QA_STORE_PASS \
            --key-pass env:QA_KEY_PASS --v2-signing-enabled true \
            --v3-signing-enabled true --out "$output" "$work/aligned.apk"
          "$BIN/apksigner" verify --verbose --print-certs "$output" > "$work/cert-check.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$work/cert-check.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$work/cert-check.txt"
          actual="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "$work/cert-check.txt")"
          expected="$(printf '%s' "$QA_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')"
          [ "${#expected}" -eq 64 ] && [ "$actual" = "$expected" ] || {
            echo "::error::QA signing certificate SHA-256 mismatch"; exit 1;
          }
          "$BIN/aapt" dump badging "$output" > "$work/badging.txt"
          grep -Fq "package: name='com.trialum.ziivaiskra.signqa'" "$work/badging.txt"
          grep -Fq "versionCode='34'" "$work/badging.txt"
          grep -Fq "versionName='1.6-LW-dev.11-signqa'" "$work/badging.txt"
          if grep -Fq 'application-debuggable' "$work/badging.txt"; then
            echo "::error::SignQA must remain non-debuggable"; exit 1
          fi
          "$BIN/zipalign" -c -p 4 "$output"
          sha256sum "$output" > signed-lw-d/SHA256SUMS
          {
            echo "source_sha=$GITHUB_SHA"
            echo "package_id=com.trialum.ziivaiskra.signqa"
            echo "firebase_android_app=EXISTING_SIGNQA_VERIFIED_DURING_BUILD"
            echo "signer=EXISTING_GITHUB_QA_KEY"
            echo "signing_certificate_sha256=$actual"
            echo "version_code=34"
            echo "status=OWNER_SIGNED_INTERNAL_LW_D_QA_NOT_PUBLIC_RELEASE"
            echo "fcmdelivery=DEVICE_OWNER_TEST_PENDING"
            echo "other_app_identities=NOT_BUILT_OR_SIGNED"
            echo "warning=DO_NOT_UNINSTALL_OR_CLEAR_PREVIOUS_APP_DATA"
          } > signed-lw-d/BUILD-INFO.txt
      - name: Upload INSTALLABLE owner-signed LW-D SignQA test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-LW-D-AGRO-S7-OWNER-SIGNED-SIGNQA-${{ github.run_number }}
          path: signed-lw-d/
          if-no-files-found: error
          retention-days: 14
