name: Build Trialum Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/trialum-v1.3-research-food-sharing

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JavaScript game regression tests
        run: |
          node tests/engine.test.cjs
          node tests/evolution.test.cjs
          node tests/progression.test.cjs

      - name: Build Android debug APK
        run: gradle -p android-template :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trialum-Android-v1.3-debug
          path: android-template/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
