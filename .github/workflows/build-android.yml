name: Trialum Android debug CI checks (NO APK distribution)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/trialum-v1.5-living-creatures
      - feature/trialum-v1.5.1-final-polish
      - feature/trialum-v1.5.2-eyes
      - feature/trialum-v1.5.3-android36
      - feature/trialum-v1.5.4-play-games
      - feature/trialum-v1.5.5-intelligence-accessibility
      - feature/trialum-v1.5.6-b-friends
      - feature/trialum-1.5.6-b-nearby-acceptance
      - feature/trialum-1.5.6-c-skills-playground
      - feature/trialum-v1.5.6-e-messages-push
      - feature/trialum-v1.5.6-f-release-gates
      - feature/trialum-v1.5.6-d-shared-playground
      - feature/trialum-lw-a-pet-presence-20261109
      - feature/trialum-1.6-lw
      - recovery/lw-a-preserved-plus-theme-en-20261110

permissions:
  contents: read

jobs:
  build:
    name: Test ephemeral debug APKs without uploading them
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install headless UI test runtime
        run: npm install --no-save --ignore-scripts --no-audit jsdom@26.1.0 gifuct-js@2.1.2

      - name: Run JavaScript game regression tests
        run: |
          node tests/engine.test.cjs
          node tests/evolution.test.cjs
          node tests/progression.test.cjs
          node tests/longplay.test.cjs
          TRIALUM_LOCALE_AUDIT=1 node tests/ui.test.cjs
          node tests/creature-media.test.cjs
          node tests/play-games.test.cjs
          node tests/version155.test.cjs
          node tests/forward-only.test.cjs
          node tests/social-ui.test.cjs
          node tests/messages-client.test.cjs
          node --test tests/release-f-gates.test.cjs
          node tests/shared-client.test.cjs
          node tests/playground.test.cjs
          node --test tests/presence.test.cjs
          node tests/lw-recovery-regression.test.cjs
          node --test tests/release-f.test.cjs
          for file in js/*.js; do node --check "$file"; done

      - name: Render creature evolution preview in headless Chrome
        continue-on-error: true
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/trialum-http.log 2>&1 &
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1260,710 --screenshot=creature-evolution-preview.png \
              http://127.0.0.1:8765/tests/art-preview.html
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1290,520 --screenshot=eye-blink-preview.png \
              http://127.0.0.1:8765/tests/eye-blink-preview.html
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1280,850 --screenshot=trialum-ui-dark.png \
              'http://127.0.0.1:8765/tests/theme-preview.html?mode=dark'
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1280,850 --screenshot=trialum-ui-light.png \
              'http://127.0.0.1:8765/tests/theme-preview.html?mode=light'
          fi

      - name: Upload creature evolution preview
        uses: actions/upload-artifact@v4
        with:
          name: Trialum-1.6-LW-Creature-Preview
          path: |
            creature-evolution-preview.png
            eye-blink-preview.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload recovery dark/light UI previews
        uses: actions/upload-artifact@v4
        with:
          name: Trialum-LW-A-Daylight-Comparison
          path: |
            trialum-ui-dark.png
            trialum-ui-light.png
          if-no-files-found: ignore
          retention-days: 14

      # Configure optional public IDs under Repository → Settings → Secrets and variables → Actions → Variables.
      # The keystore is private and belongs in Actions Secrets, never in source control.
      - name: Restore stable PGS test signing key (optional)
        env:
          TRIALUM_PGS_DEBUG_KEYSTORE_B64: ${{ secrets.TRIALUM_PGS_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$TRIALUM_PGS_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$TRIALUM_PGS_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo "Using GitHub runner debug signature; PGS OAuth requires its registered SHA-1."
          fi

      - name: Build Android debug APK
        env:
          PGS_PROJECT_ID: ${{ vars.TRIALUM_PGS_PROJECT_ID }}
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
          TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
          TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
          TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
          TRIALUM_FIREBASE_API_KEY: ${{ vars.TRIALUM_FIREBASE_API_KEY }}
          PGS_ACH_FIRST_PET: ${{ vars.TRIALUM_PGS_ACH_FIRST_PET }}
          PGS_ACH_FIRST_PLANT: ${{ vars.TRIALUM_PGS_ACH_FIRST_PLANT }}
          PGS_ACH_LEARNED: ${{ vars.TRIALUM_PGS_ACH_LEARNED }}
          PGS_ACH_ADVANCED: ${{ vars.TRIALUM_PGS_ACH_ADVANCED }}
          PGS_ACH_ECOLOGY: ${{ vars.TRIALUM_PGS_ACH_ECOLOGY }}
          PGS_ACH_LAB6: ${{ vars.TRIALUM_PGS_ACH_LAB6 }}
          PGS_ACH_DNA: ${{ vars.TRIALUM_PGS_ACH_DNA }}
          PGS_BOARD_XP: ${{ vars.TRIALUM_PGS_BOARD_XP }}
          PGS_BOARD_SPECIES: ${{ vars.TRIALUM_PGS_BOARD_SPECIES }}
        run: |
          args=()
          [ -n "$PGS_PROJECT_ID" ] && args+=("-PtrialumPgsProjectId=$PGS_PROJECT_ID")
          [ -n "$TRIALUM_SOCIAL_API_URL" ] && args+=("-PtrialumSocialApiUrl=$TRIALUM_SOCIAL_API_URL")
          [ -n "$TRIALUM_FIREBASE_APP_ID" ] && args+=("-PtrialumFirebaseAppId=$TRIALUM_FIREBASE_APP_ID")
          [ -n "$TRIALUM_FIREBASE_SENDER_ID" ] && args+=("-PtrialumFirebaseSenderId=$TRIALUM_FIREBASE_SENDER_ID")
          [ -n "$TRIALUM_FIREBASE_PROJECT_ID" ] && args+=("-PtrialumFirebaseProjectId=$TRIALUM_FIREBASE_PROJECT_ID")
          [ -n "$TRIALUM_FIREBASE_API_KEY" ] && args+=("-PtrialumFirebaseApiKey=$TRIALUM_FIREBASE_API_KEY")
          [ -n "$PGS_ACH_FIRST_PET" ] && args+=("-PtrialumPgsAchievement_first_pet=$PGS_ACH_FIRST_PET")
          [ -n "$PGS_ACH_FIRST_PLANT" ] && args+=("-PtrialumPgsAchievement_first_plant=$PGS_ACH_FIRST_PLANT")
          [ -n "$PGS_ACH_LEARNED" ] && args+=("-PtrialumPgsAchievement_learned=$PGS_ACH_LEARNED")
          [ -n "$PGS_ACH_ADVANCED" ] && args+=("-PtrialumPgsAchievement_advanced=$PGS_ACH_ADVANCED")
          [ -n "$PGS_ACH_ECOLOGY" ] && args+=("-PtrialumPgsAchievement_ecology=$PGS_ACH_ECOLOGY")
          [ -n "$PGS_ACH_LAB6" ] && args+=("-PtrialumPgsAchievement_lab6=$PGS_ACH_LAB6")
          [ -n "$PGS_ACH_DNA" ] && args+=("-PtrialumPgsAchievement_dna=$PGS_ACH_DNA")
          [ -n "$PGS_BOARD_XP" ] && args+=("-PtrialumPgsLeaderboard_xp=$PGS_BOARD_XP")
          [ -n "$PGS_BOARD_SPECIES" ] && args+=("-PtrialumPgsLeaderboard_species=$PGS_BOARD_SPECIES")
          gradle -p android-template :app:assembleDebug --no-daemon --stacktrace "${args[@]}"

      - name: Verify 1.6-LW multilingual and animation assets inside APK
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q "assets/web/locales/en.json"
          unzip -Z1 "$APK" | grep -q "assets/web/locales/mk.json"
          for locale in es fr de it pt tr sq ar zh ja ko ru hi id pl; do
            unzip -Z1 "$APK" | grep -q "assets/web/locales/$locale.json"
          done
          for module in theme onboarding advanced-intelligence social presence playground messages shared-playground shared-scene; do
            unzip -Z1 "$APK" | grep -q "assets/web/js/$module.js"
          done
          unzip -Z1 "$APK" | grep -q "assets/web/js/creature-art.js"
          unzip -Z1 "$APK" | grep -q "assets/web/js/media.js"
          unzip -Z1 "$APK" | grep -q "assets/web/js/gif-encoder.js"
          echo "Verified bilingual and media source files in APK."
      - name: Verify Android API 36 without changing installed capabilities
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name aapt -type f | sort -r | head -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/trialum-sdk36-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/trialum-sdk36-badging.txt
          grep -q "sdkVersion:'26'" /tmp/trialum-sdk36-badging.txt
          grep -q "versionName='1.6-LW-dev.2'" /tmp/trialum-sdk36-badging.txt
          echo "Verified SDK 36, minSdk 26 and 1.6-LW development APK."

      - name: Verify 1.6-LW dev manifest and privacy assets
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name aapt -type f | sort -r | head -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/trialum-rc1-badging.txt
          grep -q "versionName='1.6-LW-dev.2'" /tmp/trialum-rc1-badging.txt
          grep -q "versionCode='25'" /tmp/trialum-rc1-badging.txt
          unzip -Z1 "$APK" | grep -Fq 'assets/web/js/messages.js'
          unzip -Z1 "$APK" | grep -Fq 'assets/web/js/shared-playground.js'
          unzip -Z1 "$APK" | grep -Fq 'assets/web/js/playground.js'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'android.permission.POST_NOTIFICATIONS'
          echo "1.6-LW developer APK privacy/manifest gate passed."
      - name: Verify Play Games integration and offline fallback
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q 'assets/web/js/play-games.js'
          unzip -Z1 "$APK" | grep -q 'assets/web/locales/en.json'
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name aapt -type f | sort -r | head -n 1)
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'com.google.android.gms.games.APP_ID'
          echo 'PGS bridge bundled; 1.6-LW remains offline-first with optional verified GGUF tiers.'

      # SIGNATURE-CONTINUITY POLICY (2026-11-11):
      # Ephemeral debug APKs built here are diagnostics, NEVER installable
      # artifacts. Do not upload/distribute them: their changing debug
      # certificate would break Android in-place updates. For ALL owner
      # installation candidates use the separate owner-only GitHub Actions
      # android-signing.yml workflow with pinned per-package cert fingerprints.

      # 1.6-LW QA uses a new applicationId and separate private data sandbox.
      # Build without Play Games/Firebase IDs; only the opt-in HTTPS social URL
      # may be inherited from repository variables for two-phone beta tests.
      - name: Build isolated LW-A test APK
        env:
          TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
        run: |
          args=()
          [ -n "$TRIALUM_SOCIAL_API_URL" ] && args+=("-PtrialumSocialApiUrl=$TRIALUM_SOCIAL_API_URL")
          gradle -p android-template :app:assembleLw16 --no-daemon --stacktrace "${args[@]}"

      - name: Verify independent QA install and packaged world restore
        run: |
          set -euo pipefail
          BASE=android-template/app/build/outputs/apk
          DEBUG=$(find "$BASE/debug" -name '*.apk' -print -quit)
          QA=$(find "$BASE/lw16" -name '*.apk' -print -quit)
          test -s "$DEBUG"
          test -s "$QA"
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name aapt -type f | sort -r | head -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$DEBUG" > /tmp/trialum-regular-badging.txt
          "$AAPT" dump badging "$QA" > /tmp/trialum-lwa-badging.txt
          grep -Fq "package: name='com.trialum.ziivaiskra'" /tmp/trialum-regular-badging.txt
          grep -Fq "package: name='com.trialum.ziivaiskra.lw16'" /tmp/trialum-lwa-badging.txt
          grep -Fq "application-label:'Trialum 1.6-LW Test'" /tmp/trialum-lwa-badging.txt
          "$AAPT" dump xmltree "$DEBUG" AndroidManifest.xml > /tmp/trialum-regular-manifest.txt
          "$AAPT" dump xmltree "$QA" AndroidManifest.xml > /tmp/trialum-lwa-manifest.txt
          grep -Fq 'com.trialum.ziivaiskra.fileprovider' /tmp/trialum-regular-manifest.txt
          grep -Fq 'com.trialum.ziivaiskra.lw16.fileprovider' /tmp/trialum-lwa-manifest.txt
          grep -Fq 'trialum-lw16' /tmp/trialum-lwa-manifest.txt
          unzip -Z1 "$QA" > /tmp/trialum-lwa-assets.txt
          for asset in js/storage.js js/longplay.js js/presence.js js/shared-playground.js js/shared-scene.js; do
            grep -Fxq "assets/web/$asset" /tmp/trialum-lwa-assets.txt
          done
          echo '1.6-LW QA APK isolation and world restore assets PASS'

      # Do not upload the .lw16 ephemeral-debug APK. QA installable
      # artifacts are built and permanently signed ONLY through
      # android-signing.yml using the owner-held trialum-qa key
      # under package com.trialum.ziivaiskra.signqa.
