name: Build Trialum Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/trialum-v1.5-living-creatures
      - feature/trialum-v1.5.1-final-polish
      - feature/trialum-v1.5.2-eyes
      - feature/trialum-v1.5.3-android36
      - feature/trialum-v1.5.4-play-games

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install headless UI test runtime
        run: npm install --no-save --ignore-scripts --no-audit jsdom@26.1.0 gifuct-js@2.1.2

      - name: Run JavaScript game regression tests
        run: |
          node tests/engine.test.cjs
          node tests/evolution.test.cjs
          node tests/progression.test.cjs
          node tests/longplay.test.cjs
          TRIALUM_LOCALE_AUDIT=1 node tests/ui.test.cjs
          node tests/creature-media.test.cjs
          node tests/play-games.test.cjs
          for file in js/*.js; do node --check "$file"; done

      - name: Render creature evolution preview in headless Chrome
        continue-on-error: true
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/trialum-http.log 2>&1 &
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1260,710 --screenshot=creature-evolution-preview.png \
              http://127.0.0.1:8765/tests/art-preview.html
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1290,520 --screenshot=eye-blink-preview.png \
              http://127.0.0.1:8765/tests/eye-blink-preview.html
          fi

      - name: Upload creature evolution preview
        uses: actions/upload-artifact@v4
        with:
          name: Trialum-1.5.4-Creature-Preview
          path: |
            creature-evolution-preview.png
            eye-blink-preview.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Android debug APK
        run: gradle -p android-template :app:assembleDebug --no-daemon --stacktrace

      - name: Verify 1.5.4 bilingual and animation assets inside APK
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q "assets/web/locales/en.json"
          unzip -Z1 "$APK" | grep -q "assets/web/locales/mk.json"
          unzip -Z1 "$APK" | grep -q "assets/web/js/creature-art.js"
          unzip -Z1 "$APK" | grep -q "assets/web/js/media.js"
          unzip -Z1 "$APK" | grep -q "assets/web/js/gif-encoder.js"
          echo "Verified bilingual and media source files in APK."
      - name: Verify Android API 36 without changing installed capabilities
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name aapt -type f | sort -r | head -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/trialum-sdk36-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/trialum-sdk36-badging.txt
          grep -q "sdkVersion:'26'" /tmp/trialum-sdk36-badging.txt
          grep -q "versionName='1.5.4'" /tmp/trialum-sdk36-badging.txt
          echo "Verified SDK 36, minSdk 26 and game version 1.5.3."

      - name: Verify Play Games integration and offline fallback
        run: |
          APK=$(find android-template/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q 'assets/web/js/play-games.js'
          unzip -Z1 "$APK" | grep -q 'assets/web/locales/en.json'
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name aapt -type f | sort -r | head -n 1)
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'com.google.android.gms.games.APP_ID'
          echo 'PGS bridge bundled; Play Console ID is intentionally not fabricated.'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trialum-Android-v1.5.4-PGS-debug
          path: android-template/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
