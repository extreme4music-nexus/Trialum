name: Trialum S7 F01-F — build genuine owner-render-approved GLB (source QA only)

on:
  push:
    branches:
      - feature/lw-d-s7-f01-f-radial-wedge-render-review-20261117
    paths:
      - 'tools/b1/build-s7-f01-radial-wedge.py'
      - 'docs/blueprints/S7_F01_F_RADIAL_WEDGE_PREVIEW_SPEC_20261117.json'
      - 'tests/lw-d-s7-f01-f-model-review.test.py'
      - '.github/workflows/s7-f01-f-real-glb.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trialum-s7-f01-f-single-model-build
  cancel-in-progress: false

jobs:
  build-original-f01-f:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact F01-F feature branch (never main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify frozen F01-A source + genuine F01-F mesh, PBR and original G01 geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/b1/build-s7-f01-radial-wedge.py > /tmp/s7-f01-f-glb-manifest.json
          python3 tests/lw-d-s7-f01-f-model-review.test.py
          test -f build/s7-floor-f01/F01-F/f01-marble-cream-radial-wedge.glb
          sha256sum build/s7-floor-f01/F01-F/f01-marble-cream-radial-wedge.glb
      - name: Deliver actual binary to this GAME DEVELOPMENT branch (no runtime hook)
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/lw-d-s7-f01-f-radial-wedge-render-review-20261117"
          mkdir -p assets/models
          cp build/s7-floor-f01/F01-F/f01-marble-cream-radial-wedge.glb assets/models/
          git config user.name "trialum-s7-glb-bot"
          git config user.email "trialum-s7-glb-bot@users.noreply.github.com"
          git add -f -- assets/models/f01-marble-cream-radial-wedge.glb
          if git diff --cached --quiet; then
            echo "Exact original F01-F binary already tracked, no update needed."
          else
            git commit -m "build(s7 F01-F): commit exact genuine owner-render-approved marble GLB for review"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          echo "Model is NOT in the installed greenhouse, Android or Classic game."
