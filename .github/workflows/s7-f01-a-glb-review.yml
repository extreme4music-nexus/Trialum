name: Trialum S7 F01-A/B — genuine cream marble modular GLB REVIEW ONLY

on:
  push:
    branches:
      - feature/lw-d-s7-greenhouse-approved-art-bible-roadmap-20261117
    paths:
      - 'tools/b1/build-s7-f01-marble.py'
      - 'tools/b1/build-s7-f01-half.py'
      - 'tests/lw-d-s7-f01-a-review.test.py'
      - 'tests/lw-d-s7-f01-b-half-review.test.py'
      - '.github/workflows/s7-f01-a-glb-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialum-s7-f01-a-standalone-review
  cancel-in-progress: true

jobs:
  real-glb:
    name: Generate and verify F01-A full + F01-B complementary halves, no app changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact GitHub source without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build deterministic F01-A real GLB and embedded PNG using Python stdlib
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile tools/b1/build-s7-f01-marble.py
          python3 tools/b1/build-s7-f01-marble.py
          python3 -m py_compile tools/b1/build-s7-f01-half.py
          python3 tools/b1/build-s7-f01-half.py

      - name: Validate actual glTF structure, physical dimensions, PBR, seamless edges, no game writes
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/lw-d-s7-f01-a-review.test.py
          python3 tests/lw-d-s7-f01-b-half-review.test.py
          sha256sum build/s7-floor-f01/F01-A/f01-marble-cream-full.glb
          test "$(find build/s7-floor-f01/F01-A -name '*.glb' | wc -l)" -eq 1
          test "$(find build/s7-floor-f01/F01-B -name '*.glb' | wc -l)" -eq 2
          test ! -e prototypes/lw-d/scenes/agro-greenhouse/f01-marble-cream-full.glb
          test ! -e prototypes/lw-d/scenes/agro-greenhouse/f01-marble-cream-half-first.glb
          echo 'PASS: owner-approved F01-A unchanged, both F01-B halves valid, original app and G01 unchanged'

      - name: Upload review-only F01-A GLB, marble texture and SHA manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-S7-F01-A-REAL-MARBLE-GLB-REVIEW
          path: build/s7-floor-f01/F01-A/
          if-no-files-found: error
          retention-days: 30

      - name: Upload real F01-B complementary HALF tile pair with exact F01-A approved texture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Trialum-S7-F01-B-REAL-HALF-GLB-PAIR-REVIEW
          path: build/s7-floor-f01/F01-B/
          if-no-files-found: error
          retention-days: 30
