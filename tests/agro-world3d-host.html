<!doctype html>
<html lang="mk"><head><meta charset="utf-8"><title>Trialum S2 real 3D menu host regression</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="world3d" title="Real Living World 3D menu" src="../prototypes/lw-d/world.html?live=1"></iframe>
<script>
const child=document.getElementById("world3d");
const state={language:"mk",day:1,xp:12,credits:20,compounds:30,biomass:40,insight:50,
 labActions:3,pets:0,stage:0,research:{level:1,knowledge:0,fields:[],materials:[]},
 flora:{plants:[],habitat:{id:"qa-h",name:"QA",oxygen:60}},
 food:{recipes:[],totalStock:0},dna:{labLevel:1,petLevel:0},
 homes:[],petProfiles:[],toyCatalog:[],
 audio:{sound:false,music:false,volume:.55}};
window.addEventListener("message",event=>{
 if(event.source!==child.contentWindow||event.origin!==location.origin)return;
 if(event.data?.type==="trialum:lw:ready"){
  window.__lwReady=true;
  child.contentWindow.postMessage({type:"trialum:lw:state",world:state},location.origin);
  child.contentWindow.postMessage({type:"trialum:lw:visibility",visible:true},location.origin);
 }
});
</script></body></html>
